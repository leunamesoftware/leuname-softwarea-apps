name = "lerguie-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Limites por minuto (proteção contra abuso e custo). Ajuste sem mudar o app.
[[ratelimits]]
name = "SESSION_LIMITER"
namespace_id = "3101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DESCRIBE_LIMITER"
namespace_id = "3102"
simple = { limit = 12, period = 60 }

# OPCIONAL — cota diária por plano (ex.: 30 descrições/dia no gratuito).
# Crie com: npx wrangler kv namespace create lerguie-usage  e descomente com o id gerado.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "COLOQUE_AQUI_O_ID_DO_KV"

[vars]
ENVIRONMENT = "production"
# Modelo de IA para descrever imagens (pode ser trocado sem nova versão do app).
CLAUDE_MODEL = "claude-opus-5-5"
# Pacote Android (usado na validação de assinaturas do Google Play).
ANDROID_PACKAGE = "com.leuname.lerguie"

# SEGREDOS (nunca no código) — configure com `npx wrangler secret put NOME`:
#   ANTHROPIC_API_KEY                   chave da API da Anthropic
#   SESSION_SECRET                      texto aleatório longo (assina os tokens do app)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON    (futuro, assinaturas) JSON da conta de serviço
#   PLANS_JSON                          (opcional) catálogo de planos; ver src/plans.ts

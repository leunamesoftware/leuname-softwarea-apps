# ERP Supermisto: produtos, estoque, pedidos e ligação com a Shopee + Precificador (prints da concorrência → preços).
# Segredos (opcionais até o cadastro na Shopee Open Platform): SHOPEE_PARTNER_ID e SHOPEE_PARTNER_KEY.
# Publicado pelo workflow supermisto-precos.yml (repositório Leunamesite), que cria o banco D1 na primeira vez.
name = "supermisto-precos"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/fotos/*"]

[ai]
binding = "AI"

# Fotos dos produtos do ERP (as mesmas que vão para a Shopee)
# R2 desligado: a conta Cloudflare ainda não ativou o R2 (erro 10136). Ativar no painel e descomentar.
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "supermisto-erp"

# Pedidos novos da Shopee e envio do que mudou, a cada minuto (reserva do aviso instantâneo da Shopee)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "BANCO"
database_name = "supermisto_precos"
database_id = "ID_DO_BANCO"
migrations_dir = "migracoes"

# Login do dono pelo servidor de contas da loja LeuApps (senha da Área do Dono).
[[services]]
binding = "CONTAS"
service = "calculadora-receitas"

[vars]
DONO_EMAIL = "leunamesoftware@gmail.com"

[[routes]]
pattern = "precos.supermistotemperos.com.br"
custom_domain = true

[[routes]]
pattern = "erp.supermistotemperos.com.br"
custom_domain = true

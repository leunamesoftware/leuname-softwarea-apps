<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8590C">
  <meta name="robots" content="noindex">
  <title>Sua compra — Quanto Cobrar</title>
  <link rel="icon" href="/img/icone-192-v2.png">
  <link rel="stylesheet" href="/compra.css">
</head>
<body>
  <main class="caixa">
    <img class="logo" src="/img/logo.webp" alt="">
    <div id="conteudo" aria-live="polite"><p class="sub">Conferindo seu pagamento...</p></div>
    <p class="rodape">Dúvidas: <a href="mailto:contato@leunamesoftware.com.br">contato@leunamesoftware.com.br</a></p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    let guardado = ''; try { guardado = JSON.parse(localStorage.getItem('calc.pedido') || '""'); } catch {}
    const pedido = q.get('p') || guardado || '';
    const pagamento = q.get('payment_id') || q.get('collection_id') || '';
    const el = document.getElementById('conteudo');
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let tentativas = 0;

    const NOMES = { basico: 'Básico (vitalício)', anual: '👑 Pro anual', mensal: '👑 Pro mensal', teste: 'Teste' };
    function mostrarAprovado(d) {
      try { localStorage.removeItem('calc.pedido'); } catch {}
      const validade = d.expiraEm ? `válido até <b>${new Date(d.expiraEm).toLocaleDateString('pt-BR')}</b>` : '<b>para sempre</b>';
      el.innerHTML = `
        <h1>Pagamento aprovado, ${esc(d.nome)}! 🎉</h1>
        <p class="sub">Plano <b>${esc(NOMES[d.plano] || d.plano)}</b> · ${validade}</p>
        <ol class="passos-compra">
          <li><b>1. Abra o app</b>
            <a class="botao" href="/app/">Abrir o Quanto Cobrar</a>
            <p class="dica">Neste aparelho você já está conectado. Em outro celular, entre com o seu <b>e-mail e a senha</b> que você criou.</p></li>
          <li><b>2. Tenha sempre à mão</b>
            <a class="botao sec" href="https://www.leunamesoftware.com.br">📲 Instalar o LeuApps</a>
            <p class="dica">No LeuApps ficam todos os nossos aplicativos, sempre atualizados.</p></li>
        </ol>
        <p class="seguro">O comprovante do Mercado Pago chega no seu e-mail.</p>`;
    }

    async function conferir() {
      if (!/^[0-9a-f]{36}$/.test(pedido)) { el.innerHTML = '<h1>Pedido não encontrado</h1><p class="sub">Abra o link que apareceu depois do pagamento.</p>'; return; }
      try {
        const r = await fetch(`/api/pedido/${pedido}${pagamento && tentativas === 0 ? `?pagamento=${encodeURIComponent(pagamento)}` : ''}`);
        const d = await r.json();
        if (d.pago) return mostrarAprovado(d);
        if (d.status === 'rejected' || d.status === 'cancelled') {
          el.innerHTML = '<h1>Pagamento não aprovado</h1><p class="sub">Nada foi cobrado. Você pode tentar de novo com outra forma de pagamento.</p><a class="botao" href="/comprar">Tentar de novo</a>';
          return;
        }
        el.innerHTML = `<h1>Aguardando o pagamento</h1><p class="sub">${d.status === 'aguardando' ? 'Se você já pagou o Pix, a confirmação chega em instantes.' : 'Seu pagamento está em análise.'} Esta página atualiza sozinha.</p><div class="carregando"></div>`;
      } catch {
        el.innerHTML = '<h1>Sem conexão</h1><p class="sub">Tentando de novo...</p>';
      }
      tentativas++;
      if (tentativas < 120) setTimeout(conferir, tentativas < 20 ? 3000 : 10000);
    }
    conferir();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8590C">
  <title>Quanto Cobrar</title>
  <link rel="manifest" href="/manifest.webmanifest?v=4">
  <link rel="icon" href="/img/icone-192-v2.png">
  <link rel="apple-touch-icon" href="/img/icone-apple-180-v2.png">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <header class="topo">
    <img src="/img/logo.webp" alt="" width="36" height="36">
    <strong>Quanto Cobrar</strong>
  </header>
  <main id="tela" aria-live="polite"></main>
  <nav class="abas" id="abas" hidden>
    <button data-aba="receitas">📖<span>Receitas</span></button>
    <button data-aba="calcular">🧮<span>Calcular</span></button>
    <button data-aba="ingredientes">🛒<span>Ingredientes</span></button>
    <button data-aba="historico">📊<span>Vendas</span></button>
  </nav>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <script type="module" src="/app/app.js"></script>
  <script>
    // Aberto pelo LeuApps: mostra o atalho para voltar à loja (só nesta sessão).
    (function () {
      try {
        if (new URLSearchParams(location.search).get('leuapps') === '1') sessionStorage.setItem('leuapps', '1');
        if (sessionStorage.getItem('leuapps') !== '1') return;
      } catch (e) { return; }
      var a = document.createElement('a');
      a.href = 'https://apps.leunamesoftware.com.br/?aba=meus';
      a.setAttribute('aria-label', 'Voltar ao LeuApps');
      a.innerHTML = '<img src="https://apps.leunamesoftware.com.br/img/leuapps-192.png" alt="" style="width:100%;height:100%;display:block">';
      a.style.cssText = 'position:fixed;left:10px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:2147483647;width:46px;height:46px;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:.95';
      function por(el) { if (document.body) document.body.appendChild(el); else addEventListener('DOMContentLoaded', function () { document.body.appendChild(el); }); }
      por(a);
      // Veio do "Colocar na tela inicial": explica o atalho do navegador.
      if (new URLSearchParams(location.search).get('atalho') === '1') {
        var ios = /iPhone|iPad/i.test(navigator.userAgent);
        var d = document.createElement('div');
        d.innerHTML = '<b>📲 Colocar na tela inicial</b><br>' + (ios
          ? 'Toque em <b>Compartilhar</b> (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.'
          : 'Toque nos <b>⋮</b> do navegador (canto de cima) e depois em <b>Adicionar à tela inicial</b> ou <b>Instalar app</b>.')
          + '<button type="button" aria-label="Fechar" style="position:absolute;top:6px;right:8px;border:0;background:none;color:#fff;font-size:22px;cursor:pointer">×</button>';
        d.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:2147483647;background:#071A5C;color:#fff;border-radius:14px;padding:14px 40px 14px 14px;font:600 15px/1.4 system-ui,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.35)';
        d.querySelector('button').onclick = function () { d.remove(); };
        por(d);
      }
    })();
  </script>
</body>
</html>

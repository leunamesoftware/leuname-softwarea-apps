<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8590C">
  <title>Quanto Cobrar</title>
  <link rel="manifest" href="../manifest.webmanifest?v=5">
  <link rel="icon" href="../img/icone-192-v2.png">
  <link rel="apple-touch-icon" href="../img/icone-apple-180-v2.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topo">
    <img src="../img/logo.webp" alt="" width="36" height="36">
    <strong>Quanto Cobrar</strong>
  </header>
  <main id="tela" aria-live="polite"></main>
  <nav class="abas" id="abas" hidden>
    <button data-aba="receitas">📖<span>Receitas</span></button>
    <button data-aba="calcular">🧮<span>Calcular</span></button>
    <button data-aba="ingredientes">🛒<span>Ingredientes</span></button>
    <button data-aba="historico">📊<span>Vendas</span></button>
  </nav>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <script type="module" src="app.js"></script>
  <script>
    // Botão "Voltar à loja": sempre visível (também quando o app é aberto pelo ícone da tela inicial).
    (function () {
      try {
        if (new URLSearchParams(location.search).get('leuapps') === '1') sessionStorage.setItem('leuapps', '1');
      } catch (e) { return; }
      var a = document.createElement('a');
      a.href = 'https://www.leunamesoftware.com.br/#meus-apps';
      a.setAttribute('aria-label', 'Voltar para Meus apps, na loja LeuApps');
      // Veio da loja: volta igual à setinha do celular (para "Meus apps", sem recarregar a loja do começo).
      a.addEventListener('click', function (e) {
        try { if (/^https:\/\/www\.leunamesoftware\.com\.br\//.test(document.referrer) && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {}
      });
      a.innerHTML = '<img src="https://apps.leunamesoftware.com.br/img/leuapps-192.png" alt="" style="width:26px;height:26px;border-radius:7px;display:block"><span style="line-height:1.1;text-align:left">Voltar<br>à loja</span>';
      a.style.cssText = 'position:fixed;right:10px;top:calc(9px + env(safe-area-inset-top));z-index:2147483647;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:12px;background:#fff;color:#C2410C;font:800 12px/1.1 Poppins,system-ui,sans-serif;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.28)';
      function por(el) { if (document.body) document.body.appendChild(el); else addEventListener('DOMContentLoaded', function () { document.body.appendChild(el); }); }
      por(a);
    })();
  </script>
  <script src="../instalar.js" data-nome="Quanto Cobrar" data-icone="../img/icone-192-v2.png" data-cor="#E8590C"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8590C">
  <title>Calculadora Inteligente</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icone-192.png">
  <link rel="apple-touch-icon" href="/img/icone-apple-180.png">
  <link rel="stylesheet" href="/app/app.css">
  <style id="fundo-abertura">html,body{background:#E8590C}</style>
</head>
<body>
  <div class="splash" id="splash"><img src="/img/logo-grande.webp" alt=""><strong>Calculadora <span>Inteligente</span></strong><small>Do fazer ao vender</small></div>
  <header class="topo">
    <img src="/img/logo.webp" alt="" width="36" height="36">
    <strong>Calculadora Inteligente</strong>
  </header>
  <main id="tela" aria-live="polite"></main>
  <nav class="abas" id="abas" hidden>
    <button data-aba="receitas">📖<span>Receitas</span></button>
    <button data-aba="calcular">🧮<span>Calcular</span></button>
    <button data-aba="ingredientes">🛒<span>Ingredientes</span></button>
    <button data-aba="historico">📊<span>Vendas</span></button>
  </nav>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <script type="module" src="/app/app.js"></script>
</body>
</html>

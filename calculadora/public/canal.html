<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Canal do WhatsApp · Quanto Cobrar</title>
<style>
@font-face { font-family: Poppins; font-weight: 500; font-display: swap; src: url(/fonts/poppins-500.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; font-display: swap; src: url(/fonts/poppins-800.woff2) format('woff2'); }
:root {
  --laranja: #E8590C; --laranja-forte: #C2410C; --laranja-claro: #FFEDD5;
  --fundo: #FFF8F1; --cartao: #fff; --texto: #2B1A10; --suave: #7C6A5E; --linha: #F1E4D8;
  --verde: #15803D; --verde-claro: #DCFCE7; --amarelo: #92400E; --amarelo-claro: #FEF3C7;
}
* { box-sizing: border-box; }
body { margin: 0; font: 500 15px/1.45 Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
button { font: inherit; cursor: pointer; }
.topo { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #F97316, #E8590C); color: #fff; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
.topo h1 { margin: 0; font-size: 19px; font-weight: 800; }
.topo p { margin: 2px 0 0; font-size: 13px; opacity: .92; }
main { max-width: 640px; margin: 0 auto; padding: 14px 16px 40px; }
.redes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.redes button { border: 2px solid var(--linha); background: #fff; border-radius: 12px; padding: 10px 4px; font-weight: 800; font-size: 15px; color: var(--texto); }
.redes button[aria-selected="true"][data-rede="zap"] { border-color: #16A34A; background: #DCFCE7; color: #15803D; }
.redes button[aria-selected="true"][data-rede="tiktok"] { border-color: #111; background: #111; color: #fff; }
.dica-rede { margin: 0 0 12px; font-size: 13.5px; background: #fff; border: 1px dashed var(--linha); border-radius: 12px; padding: 10px 12px; color: var(--suave); }
.dica-rede[hidden] { display: none; }
.bt.enviar.tiktok { background: #111; color: #fff; }
.abas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.abas button { border: 1px solid var(--linha); background: #fff; border-radius: 12px; padding: 8px 4px; font-weight: 800; font-size: 13px; color: var(--suave); }
.abas button[aria-selected="true"] { background: var(--laranja); border-color: var(--laranja); color: #fff; }
.lista { display: grid; gap: 14px; }
.post { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; }
.post img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--laranja-claro); }
.corpo { padding: 12px 14px 14px; display: grid; gap: 8px; }
.cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.num { font-size: 12px; font-weight: 800; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; }
.titulo { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.25; }
.estado { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 3px 10px; justify-self: start; }
.estado.novo { background: var(--laranja-claro); color: var(--laranja-forte); }
.estado.ok { background: var(--verde-claro); color: var(--verde); }
.estado.velho { background: var(--amarelo-claro); color: var(--amarelo); }
.post.feito { opacity: .62; }
.post.feito .titulo { text-decoration: line-through; text-decoration-thickness: 2px; }
.post.feito img { filter: grayscale(.5); }
details summary { color: var(--laranja-forte); font-weight: 800; font-size: 14px; cursor: pointer; }
pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; font-size: 13.5px; background: #FFFBF6; border: 1px solid var(--linha); border-radius: 10px; padding: 10px; margin: 8px 0 0; max-height: 320px; overflow: auto; }
.botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.botoes .enviar { grid-column: 1 / -1; }
.bt { min-height: 46px; border: 0; border-radius: 12px; font-weight: 800; padding: 10px; }
.bt.enviar { background: #16A34A; color: #fff; font-size: 16px; }
.bt.sec { background: var(--laranja-claro); color: var(--laranja-forte); }
.bt:focus-visible, .abas button:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
.vazio, .aviso { text-align: center; color: var(--suave); padding: 30px 10px; }
.aviso a { color: var(--laranja-forte); font-weight: 800; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: #2B1A10; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<header class="topo">
  <h1>📲 Postagens prontas</h1>
  <p>Escolha a rede, toque em "Enviar" e escolha onde postar. O que já foi enviado fica riscado, com a data.</p>
</header>
<main>
  <div class="redes" role="tablist" aria-label="Rede">
    <button role="tab" data-rede="zap" aria-selected="true">💬 WhatsApp</button>
    <button role="tab" data-rede="tiktok" aria-selected="false">🎵 TikTok</button>
  </div>
  <p class="dica-rede" id="dica-rede" hidden>No TikTok o link do texto não é clicável: deixe o link do canal do WhatsApp na sua <b>bio</b>. O botão envia a foto em pé e deixa a legenda copiada: é só colar.</p>
  <div class="abas" role="tablist">
    <button role="tab" id="aba-enviar" data-aba="enviar" aria-selected="true">Para enviar</button>
    <button role="tab" id="aba-enviadas" data-aba="enviadas" aria-selected="false">Enviadas</button>
    <button role="tab" id="aba-todas" data-aba="todas" aria-selected="false">Todas</button>
  </div>
  <div class="lista" id="lista"><p class="vazio">Carregando…</p></div>
</main>
<div id="toast" hidden></div>
<script>
// Dentro da loja o endereço é www.leunamesoftware.com.br/quantocobrar/canal; direto, quantocobrar.leunamesoftware.com.br/canal.
const BASE = location.pathname.replace(/\/canal(\.html)?\/?$/, '');
const DIAS_REENVIAR = 30; // o WhatsApp some com as postagens antigas do canal: depois disso, reenvie.
let todos = [], posts = [], aba = 'enviar', rede = 'zap';
try { aba = localStorage.getItem('canal.aba') || 'enviar'; rede = localStorage.getItem('canal.rede') || 'zap'; } catch {}

// Cada rede tem o seu texto e a sua marcação de enviado. No TikTok só vão as receitas.
function vistas() {
  if (rede === 'zap') return todos;
  return todos.filter((p) => p.tipo === 'receita').map((p) => ({ ...p, id: 'tt:' + p.id, texto: p.tiktok, enviadoEm: p.enviadoTikTok, rede: 'tiktok' }));
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dias = (iso) => Math.floor((Date.now() - Date.parse(iso)) / 864e5);
const data = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const vencida = (p) => p.enviadoEm && dias(p.enviadoEm) >= DIAS_REENVIAR;
const pendente = (p) => !p.enviadoEm || vencida(p);

function aviso(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => { el.hidden = true; }, 4000);
}

async function carregar() {
  const r = await fetch(BASE + '/api/canal', { cache: 'no-store', credentials: 'same-origin' });
  if (r.status === 403) {
    document.getElementById('lista').innerHTML = `<p class="aviso">Esta página é só do dono.<br><a href="${BASE}/app/">Entre no app com a conta do dono</a> e volte aqui.</p>`;
    return;
  }
  todos = (await r.json()).posts || [];
  mostrar();
}

function mostrar() {
  posts = vistas();
  document.querySelectorAll('[data-rede]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.rede === rede)));
  document.getElementById('dica-rede').hidden = rede !== 'tiktok';
  const filtro = { enviar: pendente, enviadas: (p) => p.enviadoEm && !vencida(p), todas: () => true }[aba];
  document.querySelectorAll('[data-aba]').forEach((b) => {
    const n = posts.filter({ enviar: pendente, enviadas: (p) => p.enviadoEm && !vencida(p), todas: () => true }[b.dataset.aba]).length;
    b.textContent = `${{ enviar: 'Para enviar', enviadas: 'Enviadas', todas: 'Todas' }[b.dataset.aba]} (${n})`;
    b.setAttribute('aria-selected', String(b.dataset.aba === aba));
  });
  const lista = posts.filter(filtro);
  document.getElementById('lista').innerHTML = lista.length ? lista.map(cartao).join('')
    : `<p class="vazio">${aba === 'enviar' ? 'Tudo enviado! As próximas receitas aparecem aqui quando forem liberadas.' : 'Nada por aqui.'}</p>`;
}

function cartao(p) {
  const estado = !p.enviadoEm ? '<span class="estado novo">Ainda não enviada</span>'
    : vencida(p) ? `<span class="estado velho">⚠️ Enviada há ${dias(p.enviadoEm)} dias: reenvie</span>`
    : `<span class="estado ok">✔️ Enviada em ${data(p.enviadoEm)}</span>`;
  const feito = p.enviadoEm && !vencida(p);
  return `<article class="post ${feito ? 'feito' : ''}">
    ${p.foto ? `<img src="${esc(BASE + p.foto)}" alt="" loading="lazy">` : ''}
    <div class="corpo">
      <div class="cab"><span class="num">${p.tipo === 'dica' ? `💡 Dica ${p.numero}` : `Receita ${p.numero}`}</span></div>
      <h2 class="titulo">${esc(p.titulo)}</h2>
      ${estado}
      <details><summary>Ver o texto</summary><pre>${esc(p.texto)}</pre></details>
      <div class="botoes">
        <button class="bt enviar ${p.rede === 'tiktok' ? 'tiktok' : ''}" data-enviar="${esc(p.id)}">${p.rede === 'tiktok' ? '🎵' : '📤'} ${p.enviadoEm ? 'Reenviar' : 'Enviar'} para o ${p.rede === 'tiktok' ? 'TikTok' : 'WhatsApp'}</button>
        <button class="bt sec" data-copiar="${esc(p.id)}">📋 Copiar texto</button>
        <button class="bt sec" data-marcar="${esc(p.id)}">${vencida(p) ? '✔️ Já reenviei' : p.enviadoEm ? '↩️ Desmarcar' : '✔️ Já enviei'}</button>
      </div>
    </div>
  </article>`;
}

async function marcar(p, enviado) {
  const r = await fetch(BASE + '/api/canal/enviado', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id, enviado }) });
  if (!r.ok) return aviso('Não consegui salvar. Confira a internet e tente de novo.');
  const original = todos.find((x) => x.id === p.id.replace(/^tt:/, ''));
  if (original) original[p.rede === 'tiktok' ? 'enviadoTikTok' : 'enviadoEm'] = enviado ? new Date().toISOString() : null;
  mostrar();
}

// A foto vai em JPG (o WhatsApp aceita melhor que WebP).
async function fotoJpg(p) {
  const img = new Image();
  img.src = BASE + p.foto;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.92));
  return new File([blob], p.id.split(':').pop() + '.jpg', { type: 'image/jpeg' });
}

// TikTok: duas fotos em pé (1080×1920) — capa limpa e a lista do que vai na receita.
// Todo texto fica na faixa que o TikTok não cobre: abaixo da busca do topo (y > 260),
// acima da legenda de baixo (y < 1380) e longe dos botões da direita (x < 940).
const TT = { W: 1080, H: 1920, topo: 260, fim: 1380, laranja: '#E8590C', letra: 'system-ui, -apple-system, Roboto, sans-serif' };

function quebrar(g, texto, largura) {
  const linhas = [];
  let atual = '';
  for (const palavra of texto.split(' ')) {
    const tenta = (atual + ' ' + palavra).trim();
    if (g.measureText(tenta).width > largura && atual) { linhas.push(atual); atual = palavra; } else atual = tenta;
  }
  return [...linhas, atual];
}

function caixa(g, x, y, w, h, r, cor) {
  g.fillStyle = cor; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
}

async function telaTikTok(p) {
  const img = new Image();
  img.src = BASE + p.foto;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = TT.W; c.height = TT.H;
  const g = c.getContext('2d');
  const capa = Math.max(TT.W / img.naturalWidth, TT.H / img.naturalHeight);
  g.filter = 'blur(40px) brightness(0.45)';
  g.drawImage(img, (TT.W - img.naturalWidth * capa) / 2, (TT.H - img.naturalHeight * capa) / 2, img.naturalWidth * capa, img.naturalHeight * capa);
  g.filter = 'none';
  return { c, g, img };
}

const paraArquivo = (c, nome) => new Promise((ok) => c.toBlob((b) => ok(new File([b], nome, { type: 'image/jpeg' })), 'image/jpeg', 0.9));

async function fotoTikTok(p) {
  const base = p.id.split(':').pop();
  // 1) Capa: a foto grande e o nome numa faixa laranja logo abaixo.
  const um = await telaTikTok(p);
  let { g } = um;
  const h = Math.min(um.img.naturalHeight * (TT.W / um.img.naturalWidth), 800), y = TT.topo + 30;
  g.save(); g.beginPath(); g.rect(0, y, TT.W, h); g.clip();
  g.drawImage(um.img, 0, y + (h - um.img.naturalHeight * (TT.W / um.img.naturalWidth)) / 2, TT.W, um.img.naturalHeight * (TT.W / um.img.naturalWidth));
  g.restore();
  let tam = 96, linhas;
  do { g.font = `900 ${tam}px ${TT.letra}`; linhas = quebrar(g, p.titulo.toUpperCase(), 760); tam -= 6; } while (linhas.length > 2 && tam > 60);
  tam += 6;
  const faixa = linhas.length * (tam + 14) + 130;
  caixa(g, 60, y + h + 40, 880, faixa, 28, TT.laranja);
  g.textAlign = 'center'; g.fillStyle = '#fff';
  linhas.forEach((l, i) => g.fillText(l, 500, y + h + 40 + 30 + tam + i * (tam + 14)));
  g.font = `700 44px ${TT.letra}`; g.fillStyle = '#FFEDD5';
  g.fillText('arraste para o lado  ➜', 500, y + h + 40 + faixa - 34);

  // 2) O que vai: só os nomes dos ingredientes; o resto fica no canal.
  const dois = await telaTikTok(p);
  g = dois.g;
  const itens = p.itens || [];
  const cta = 150, larg = 760;
  let t = 58, blocos;
  for (; t >= 34; t -= 4) {
    g.font = `700 ${t}px ${TT.letra}`;
    blocos = itens.map((i) => quebrar(g, i, larg - 50));
    const alto = 150 + blocos.flat().length * t * 1.3 + 40 + cta;
    if (alto <= TT.fim - TT.topo - 20) break;
  }
  const alturaLista = blocos.flat().length * t * 1.3;
  const alto = 150 + alturaLista + 40 + cta, y2 = TT.topo + Math.max(20, (TT.fim - TT.topo - alto) / 2);
  caixa(g, 60, y2, 880, alto, 32, '#fff');
  g.textAlign = 'left'; g.fillStyle = '#1C1917';
  g.font = `900 64px ${TT.letra}`; g.fillText('O que vai', 120, y2 + 100);
  g.fillStyle = TT.laranja; g.fillRect(120, y2 + 122, 120, 8);
  g.font = `700 ${t}px ${TT.letra}`;
  let ly = y2 + 150 + t;
  for (const b of blocos) {
    g.fillStyle = TT.laranja; g.beginPath(); g.arc(134, ly - t * 0.35, t * 0.16, 0, 7); g.fill();
    g.fillStyle = '#1C1917';
    b.forEach((l) => { g.fillText(l, 170, ly); ly += t * 1.3; });
  }
  caixa(g, 60, y2 + alto - cta, 880, cta, 32, TT.laranja);
  g.fillRect(60, y2 + alto - cta, 880, 32); // canto de cima reto, emendado no cartão
  g.textAlign = 'center'; g.fillStyle = '#fff';
  const caber = (peso, px, texto) => { do g.font = `${peso} ${px}px ${TT.letra}`; while (g.measureText(texto).width > 800 && --px > 28); };
  caber(800, 42, 'Quantidades e modo de fazer no canal'); g.fillText('Quantidades e modo de fazer no canal', 500, y2 + alto - cta + 62);
  caber(900, 48, 'do WhatsApp 👉 link na bio'); g.fillText('do WhatsApp 👉 link na bio', 500, y2 + alto - cta + 120);

  return [await paraArquivo(um.c, base + '-tiktok-1.jpg'), await paraArquivo(dois.c, base + '-tiktok-2.jpg')];
}

async function copiar(p) {
  try { await navigator.clipboard.writeText(p.texto); return true; } catch { return false; }
}

async function enviar(p) {
  const copiou = await copiar(p); // se o app não trouxer o texto junto, é só colar
  try {
    // O TikTok ignora o texto: vai só a foto, e a legenda fica copiada para colar.
    const dados = p.rede === 'tiktok' ? {} : { text: p.texto };
    if (p.foto) {
      // TikTok: as duas fotos juntas viram um carrossel; se o celular não aceitar duas, vai só a capa.
      const fs = p.rede === 'tiktok' ? await fotoTikTok(p) : [await fotoJpg(p)];
      if (navigator.canShare && navigator.canShare({ files: fs })) dados.files = fs;
      else if (navigator.canShare && navigator.canShare({ files: [fs[0]] })) dados.files = [fs[0]];
    }
    if (!navigator.share) throw Object.assign(new Error('sem compartilhar'), { name: 'SemShare' });
    await navigator.share(dados);
    await marcar(p, true);
    aviso(p.rede === 'tiktok' ? 'Marcada como enviada. A legenda está copiada: cole no TikTok. Em "Mais opções", ligue "Conteúdo gerado por IA".' : 'Marcada como enviada. ' + (copiou ? 'O texto também ficou copiado, se precisar colar.' : ''));
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (p.foto) window.open(BASE + p.foto, '_blank');
    aviso(copiou ? 'Texto copiado. Salve a foto que abriu e envie pelo WhatsApp; depois toque em "Já enviei".' : 'Copie o texto em "Ver o texto" e envie pelo WhatsApp.');
  }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.aba) { aba = b.dataset.aba; try { localStorage.setItem('canal.aba', aba); } catch {} return mostrar(); }
  if (b.dataset.rede) { rede = b.dataset.rede; try { localStorage.setItem('canal.rede', rede); } catch {} return mostrar(); }
  const p = posts.find((x) => x.id === (b.dataset.enviar || b.dataset.copiar || b.dataset.marcar));
  if (!p) return;
  if (b.dataset.enviar) enviar(p);
  else if (b.dataset.copiar) copiar(p).then((ok) => aviso(ok ? 'Texto copiado!' : 'Não deu para copiar: abra "Ver o texto" e copie.'));
  else marcar(p, !p.enviadoEm || vencida(p));
});
carregar().catch(() => { document.getElementById('lista').innerHTML = '<p class="aviso">Sem internet. Tente de novo em instantes.</p>'; });
</script>
</body>
</html>

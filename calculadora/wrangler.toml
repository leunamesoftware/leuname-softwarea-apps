name = "calculadora-receitas"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "quantocobrar.leunamesoftware.com.br", custom_domain = true },
  # endereço antigo: só redireciona para o novo
  { pattern = "calculadora.leunamesoftware.com.br", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Banco da calculadora (rendimento anônimo e pedidos).
[[d1_databases]]
binding = "DB"
database_name = "calculadora-receitas"
database_id = "7117bdcb-9d07-49ed-88a5-a57502ef1b73"
migrations_dir = "migrations"

# Banco do servidor de licenças da LeuName: a chave nasce e é bloqueada aqui (aparece no painel de licenças).
[[d1_databases]]
binding = "LICDB"
database_name = "leuname_licencas"
database_id = "4f3f9185-7743-4c36-b86e-92c557847c1e"

# APK do app Android (mesmo bucket dos downloads da LeuName).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "leuname-downloads"

# Proteção contra quem tenta adivinhar chaves ou abusar da compra.
[[ratelimits]]
name = "LIMITE"
namespace_id = "4101"
simple = { limit = 10, period = 60 }

[vars]
APP_ID = "calculadora-receitas"
# Conta do dono: vê também as receitas agendadas (ainda escondidas para os clientes).
DONO_EMAIL = "leunamesoftware@gmail.com"
# Aviso do Mercado Pago sempre neste endereço (compras feitas pela loja www também).
URL_AVISO = "https://quantocobrar.leunamesoftware.com.br"

# Segredo (nunca no código): MP_ACCESS_TOKEN — Access Token de produção do Mercado Pago.

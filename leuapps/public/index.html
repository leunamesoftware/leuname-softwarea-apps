<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071A5C">
  <title>LeuApps — aplicativos LeuName Softwares</title>
  <meta name="description" content="Todos os aplicativos da LeuName Softwares em um só lugar. Abra e use, sempre atualizados.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/leuapps-192.png">
  <link rel="apple-touch-icon" href="/img/leuapps-192.png">
  <style>
    :root { --fundo: #F4F6FB; --cartao: #fff; --texto: #10162B; --suave: #5B6478; --linha: #E3E7F0; --azul: #1B4DFF; --azul-escuro: #071A5C; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #0B1022; --cartao: #141B33; --texto: #EEF1F8; --suave: #A3ACC2; --linha: #232C4A; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 500 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
    .topo { position: sticky; top: 0; z-index: 2; background: linear-gradient(135deg, #071A5C, #1B3FD6); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; }
    .marca { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; }
    .marca img { width: 40px; height: 40px; border-radius: 11px; }
    .marca b { font-size: 21px; font-weight: 800; letter-spacing: .2px; }
    .marca small { display: block; font-size: 12px; opacity: .8; font-weight: 600; }
    .busca { max-width: 720px; margin: 12px auto 0; }
    .busca input { width: 100%; min-height: 46px; border: 0; border-radius: 999px; padding: 0 18px; font: inherit; font-size: 16px; background: rgba(255,255,255,.95); color: #10162B; }
    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
    h2 { font-size: 17px; margin: 8px 0 12px; }
    .lista { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .app { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 12px; }
    .app img { width: 64px; height: 64px; border-radius: 16px; display: block; }
    .app h3 { margin: 0; font-size: 16px; }
    .app .cat { font-size: 13px; color: var(--suave); font-weight: 600; }
    .app .resumo { margin: 2px 0 0; font-size: 13px; color: var(--suave); line-height: 1.35; }
    .app .preco { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 800; color: #0F8A4B; }
    .abrir { min-width: 82px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--azul); color: #fff; font-weight: 800; text-decoration: none; padding: 0 16px; }
    .vazio { color: var(--suave); text-align: center; padding: 24px 0; }
    .instalar { display: none; margin: 0 0 16px; padding: 14px; border-radius: 18px; background: var(--cartao); border: 2px solid var(--azul); }
    .instalar b { display: block; }
    .instalar p { margin: 4px 0 10px; font-size: 14px; color: var(--suave); }
    .instalar button { border: 0; font: inherit; cursor: pointer; }
    .rodape { text-align: center; font-size: 13px; color: var(--suave); padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
    @media (max-width: 380px) { .app { grid-template-columns: 52px 1fr; } .app img { width: 52px; height: 52px; } .abrir { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca"><img src="/img/leuapps-192.png" alt=""><div><b>LeuApps</b><small>Aplicativos LeuName Softwares</small></div></div>
    <div class="busca"><input id="busca" type="search" placeholder="Buscar aplicativo" aria-label="Buscar aplicativo" autocomplete="off"></div>
  </header>
  <main>
    <div class="instalar" id="instalar">
      <b>📲 Coloque o LeuApps na tela do celular</b>
      <p>Um ícone só, com todos os nossos aplicativos sempre atualizados.</p>
      <button class="abrir" id="instalar-btn" type="button">Instalar</button>
    </div>
    <h2>Aplicativos</h2>
    <ul class="lista" id="lista"><li class="vazio">Carregando…</li></ul>
  </main>
  <p class="rodape">LeuName Softwares · Todos os aplicativos sempre na versão mais nova.</p>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const lista = document.getElementById('lista');
    let apps = [];
    function mostrar(filtro = '') {
      const f = filtro.trim().toLowerCase();
      const vis = apps.filter((a) => !f || (a.nome + ' ' + a.categoria + ' ' + a.resumo).toLowerCase().includes(f));
      lista.innerHTML = vis.map((a) => `
        <li class="app">
          <img src="${esc(a.icone)}" alt="" loading="lazy">
          <div><h3>${esc(a.nome)}</h3><div class="cat">${esc(a.categoria)}</div><p class="resumo">${esc(a.resumo)}</p><span class="preco">${esc(a.preco)}</span></div>
          <a class="abrir" href="${esc(a.url)}">Abrir</a>
        </li>`).join('') || '<li class="vazio">Nenhum aplicativo encontrado.</li>';
    }
    fetch('/apps.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => { apps = d; mostrar(); })
      .catch(() => { lista.innerHTML = '<li class="vazio">Sem internet. Conecte-se para ver os aplicativos.</li>'; });
    document.getElementById('busca').addEventListener('input', (e) => mostrar(e.target.value));

    // Instalar na tela inicial (navegador). No app Android isso não aparece.
    let pedido = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedido = e; document.getElementById('instalar').style.display = 'block'; });
    document.getElementById('instalar-btn').addEventListener('click', async () => { if (!pedido) return; pedido.prompt(); await pedido.userChoice; pedido = null; document.getElementById('instalar').style.display = 'none'; });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>

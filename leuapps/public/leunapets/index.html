<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101B3F">
<title>LeunaPets</title>
<link rel="icon" href="/leunapets/icone-192.png">
<style>
:root{--rosa:#F0306E;--rosa2:#FFE4EC;--azul:#101B3F;--azul2:#1B2A5C;--fundo:#F5F6FA;--card:#fff;--texto:#101B3F;--mudo:#667089;--linha:#E3E6EF;--verde:#12875A;--verde2:#DDF5EA;--amar:#B7791F;--amar2:#FFF4D6;--verm:#C0272D;--verm2:#FDE3E4;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rosa)}
.oculto{display:none!important}
/* entrada */
#entrada{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--azul),var(--azul2))}
#entrada form{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 50px #0006}
#entrada img{height:46px;display:block;margin:0 auto 6px;background:var(--azul);padding:8px 14px;border-radius:12px}
#entrada h1{font-size:20px;text-align:center;margin:10px 0 4px}
#entrada p{color:var(--mudo);text-align:center;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--mudo);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--linha);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rosa)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--rosa);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--linha)}
.btn.peq{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.verm{background:#fff;color:var(--verm);border:1.5px solid var(--verm2)}
.erro{color:var(--verm);font-size:13px;margin:8px 0 0;min-height:18px}
#entrada .btn{width:100%;margin-top:14px}
/* estrutura */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--azul);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{height:40px;display:block;margin:2px 6px 16px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C8CFE6;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:2px}
nav button:hover{background:#ffffff14;color:#fff}
nav button.ativo{background:var(--rosa);color:#fff}
nav .grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7F8BB0;margin:16px 12px 6px}
nav .sair{margin-top:18px;color:#9AA5C8}
main{padding:22px clamp(14px,3vw,34px) 60px;max-width:1280px;width:100%}
h2{margin:0 0 4px;font-size:24px}
.sub{color:var(--mudo);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:16px}
.grade{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(135deg,var(--azul),var(--azul2))}
.kpi.r{background:linear-gradient(135deg,var(--rosa),#C21E56)}
.kpi.v{background:linear-gradient(135deg,#12875A,#0B5E3E)}
.kpi small{opacity:.8;display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:28px;display:block;margin-top:4px}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.linha>*{flex:1 1 140px}
.linha>.fixo{flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--rosa2);color:var(--azul);border-radius:99px;padding:5px 6px 5px 12px;font-weight:600;font-size:13px}
.chip button{border:0;background:#fff;border-radius:99px;width:22px;height:22px;cursor:pointer;color:var(--verm)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.prod{background:#fff;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .foto{aspect-ratio:1/1;background:#EEF0F6 center/cover no-repeat;position:relative}
.prod .pos{position:absolute;left:8px;top:8px;background:var(--azul);color:#fff;border-radius:99px;font-size:12px;padding:2px 9px;font-weight:700}
.prod .corpo{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .tit{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .loja{color:var(--mudo);font-size:12px}
.prod .preco{font-size:18px;font-weight:800;color:var(--rosa)}
.prod .acoes{display:flex;gap:6px;margin-top:auto}
.prod .acoes .btn{flex:1}
.selo{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.selo.v{background:var(--verde2);color:var(--verde)}.selo.a{background:var(--amar2);color:var(--amar)}.selo.x{background:var(--verm2);color:var(--verm)}.selo.n{background:#E9ECF5;color:var(--azul)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.res div{background:var(--fundo);border-radius:10px;padding:10px 12px}
.res small{color:var(--mudo);display:block;font-size:12px}.res b{font-size:18px}
.veredito{border-radius:12px;padding:12px 14px;font-weight:700;margin-top:12px}
.veredito.v{background:var(--verde2);color:var(--verde)}.veredito.a{background:var(--amar2);color:var(--amar)}.veredito.x{background:var(--verm2);color:var(--verm)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--linha);text-align:left}
th{font-size:12px;color:var(--mudo);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right}
.tabela{overflow:auto}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.col{background:#ECEEF5;border-radius:var(--r);padding:10px}
.col h4{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between}
.item{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--linha)}
.item .t{font-weight:700;font-size:14px}
.item .m{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--mudo)}
.item img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#EEF0F6}
.item select,.item textarea{padding:6px 8px;font-size:13px;margin-top:6px}
.nota{color:var(--mudo);font-size:13px}
.aviso{background:var(--amar2);color:#7A5410;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.atalho{display:block;text-decoration:none;color:var(--azul);background:#fff;border:1.5px solid var(--linha);border-radius:12px;padding:12px 14px;font-weight:700}
.atalho small{display:block;color:var(--mudo);font-weight:400;margin-top:2px}
.atalho:hover{border-color:var(--rosa)}
.check label{display:flex;gap:10px;align-items:flex-start;margin:0;padding:8px 0;border-bottom:1px solid var(--linha);color:var(--texto);font-size:14px;font-weight:500;cursor:pointer}
.check input{width:auto;margin-top:3px}
.check label.feito span{text-decoration:line-through;color:var(--mudo)}
.barra{height:10px;background:#E9ECF5;border-radius:99px;overflow:hidden}.barra i{display:block;height:100%;background:var(--rosa)}
#topo{display:none}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;display:flex;overflow-x:auto;padding:6px;z-index:5;gap:2px}
  nav .logo,nav .grupo,nav .sair{display:none}
  nav button{flex:0 0 auto;flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;width:auto;text-align:center;margin:0}
  main{padding-bottom:100px}
  #topo{display:flex;align-items:center;justify-content:space-between;background:var(--azul);padding:8px 14px}
  #topo img{height:30px}
}
.fotos-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}.foto-card{position:relative;display:block;border:2px solid var(--linha);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff}.foto-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.foto-card input{position:absolute;top:6px;left:6px;width:20px;height:20px}.foto-card small{display:block;padding:4px 6px;font-size:11px;color:#555}.foto-card.marcada{border-color:var(--verm,#d33);box-shadow:0 0 0 2px #d3333355}
</style>
</head>
<body>

<div id="entrada" class="oculto">
  <form id="f-entrar">
    <img src="/leunapets/logo-branco.webp" alt="LeunaPets">
    <h1>LeunaPets</h1>
    <p id="e-sub">Entre com a sua conta de dono.</p>
    <label for="e-email">E-mail</label><input id="e-email" type="email" autocomplete="username" required>
    <label for="e-senha" id="e-l-senha">Senha da Área do Dono</label><input id="e-senha" type="password" autocomplete="current-password" required>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:500;cursor:pointer"><input id="e-ver" type="checkbox" style="width:auto"> 👁 Mostrar a senha</label>
    <div id="e-rep" class="oculto"><label for="e-senha2">Repita a senha</label><input id="e-senha2" type="password" autocomplete="new-password"></div>
    <div class="erro" id="e-erro"></div>
    <button class="btn" type="submit" id="e-btn">Entrar</button>
  </form>
</div>

<div id="topo"><img src="/leunapets/logo-branco.webp" alt="LeunaPets"><span style="color:#C8CFE6;font-size:13px">Loja de cães e gatos</span></div>

<div id="app" class="oculto">
  <nav id="menu">
    <img class="logo" src="/leunapets/logo-branco.webp" alt="LeunaPets">
    <button data-v="painel">📊 Painel</button>
    <div class="grupo">Produtos</div>
    <button data-v="radar">🔎 Lojas concorrentes</button>
    <button data-v="fornecedor">📦 Fornecedor (CJ)</button>
    <button data-v="calc">🧮 Calculadora</button>
    <button data-v="meus">⭐ Meus produtos</button>
    <button data-v="loja">🛍 Minha loja</button>
    <button data-v="fotos">🖼 Fotos</button>
    <div class="grupo">Tráfego pago</div>
    <button data-v="meta">📘 Facebook e Instagram</button>
    <button data-v="tiktok">🎵 TikTok</button>
    <button data-v="google">🔍 Google</button>
    <button id="atualizar-app" class="sair" title="Recarrega o app com a versão mais nova">↻ Atualizar o app</button>
    <button class="sair" id="sair" style="margin-top:2px">Sair</button>
  </nav>
  <main id="tela"></main>
</div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => (Number.isFinite(n) ? n : 0).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const arred = (x) => Math.round(x * 100) / 100;

// ---------- dados (ficam neste navegador; dá para exportar e importar) ----------
const CHAVE = 'leunapets_app_v1';
const VAZIO = () => ({ enviados: {}, lojas: [], cache: [], meus: [], camp: [], feito: {}, cfg: { iva: 23, ioss: 3, stripe: 1.5, stripeFixo: 0.25, multiplo: 2.5, teto: 45 } });
let D = VAZIO();
try { const g = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (g && typeof g === 'object') D = { ...VAZIO(), ...g, cfg: { ...VAZIO().cfg, ...(g.cfg || {}) } }; } catch {}
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(D)); } catch {} };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- conta ----------
async function api(caminho, corpo) {
  const r = await fetch('/loja-api/dono/' + caminho, corpo === undefined ? { credentials: 'same-origin', cache: 'no-store' }
    : { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  let j = null; try { j = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, j };
}
let criando = false;
$('#e-ver').addEventListener('change', (e) => { $('#e-senha').type = e.target.checked ? 'text' : 'password'; $('#e-senha2').type = e.target.checked ? 'text' : 'password'; });
async function iniciar() {
  let est = null;
  try { est = (await api('estado')).j; } catch {}
  if (est?.logado) return abrirApp();
  $('#entrada').classList.remove('oculto');
  if (est && !est.temSenha) {
    criando = true;
    $('#e-sub').textContent = 'Primeiro acesso: crie a sua senha de dono (mínimo 6 letras ou números). Use o e-mail do dono.';
    $('#e-l-senha').textContent = 'Crie a sua senha';
    $('#e-senha').autocomplete = 'new-password';
    $('#e-rep').classList.remove('oculto'); $('#e-senha2').required = true;
    $('#e-btn').textContent = 'Criar senha e entrar';
  }
  if (!est) $('#e-erro').textContent = 'Sem internet agora. Tente de novo.';
}
$('#f-entrar').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#e-erro').textContent = '';
  if (criando && $('#e-senha').value !== $('#e-senha2').value) return ($('#e-erro').textContent = 'As duas senhas não são iguais.');
  const r = await api(criando ? 'criar' : 'entrar', { email: $('#e-email').value.trim(), senha: $('#e-senha').value }).catch(() => null);
  if (r?.ok) { $('#entrada').classList.add('oculto'); return abrirApp(); }
  const c = r?.j?.erro;
  $('#e-erro').textContent = c === 'email' ? 'Este não é o e-mail do dono. Confira se é leunamesoftware@gmail.com.' : c === 'senha_curta' ? 'A senha precisa ter pelo menos 6 letras ou números.'
    : c === 'ja_existe' ? 'A senha já foi criada. Feche e abra o app para entrar.' : r?.status === 429 ? 'Muitas tentativas. Espere um pouco.' : 'E-mail ou senha incorretos.';
});
$('#atualizar-app').addEventListener('click', () => location.reload());
$('#sair').addEventListener('click', async () => { await api('sair', {}).catch(() => {}); location.reload(); });

// ---------- navegação ----------
let vista = 'painel';
function abrirApp() {
  $('#app').classList.remove('oculto');
  $('#topo').style.display = '';
  $('#menu').addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) ir(b.dataset.v); });
  ir(location.hash.slice(1) || 'painel');
}
function ir(v) {
  if (!TELAS[v]) v = 'painel';
  vista = v; location.hash = v;
  document.querySelectorAll('#menu button[data-v]').forEach((b) => b.classList.toggle('ativo', b.dataset.v === v));
  $('#tela').innerHTML = TELAS[v]();
  if (LIGAR[v]) LIGAR[v]();
  window.scrollTo(0, 0);
}
const refazer = () => { const y = window.scrollY; $('#tela').innerHTML = TELAS[vista](); if (LIGAR[vista]) LIGAR[vista](); window.scrollTo(0, y); };

// ---------- contas de lucro (mesma regra do servidor, calculadora/src/radar.js) ----------
function lucro({ preco, custo, frete, anuncio = 0 }) {
  const c = D.cfg, P = num(preco);
  if (P <= 0) return null;
  const iva = P - P / (1 + c.iva / 100), ioss = P * c.ioss / 100, pag = P * c.stripe / 100 + c.stripeFixo;
  const custos = num(custo) + num(frete) + iva + ioss + pag;
  const antes = P - custos, final = antes - num(anuncio);
  const fixos = num(custo) + num(frete) + c.stripeFixo + num(anuncio);
  const variavel = 1 / (1 + c.iva / 100) - c.ioss / 100 - c.stripe / 100;
  return { iva: arred(iva), ioss: arred(ioss), pag: arred(pag), custos: arred(custos), antes: arred(antes), lucro: arred(final), margem: arred(final / P * 100), eq: variavel > 0 ? arred(fixos / variavel) : null, anuncioMax: arred(Math.max(0, antes)) };
}
function veredito(l) {
  if (!l) return '';
  const m = l.antes / (l.custos + l.antes) * 100; // margem antes de anúncios
  if (l.antes <= 0) return '<div class="veredito x">❌ Dá prejuízo antes mesmo dos anúncios. Descartar ou subir o preço.</div>';
  if (m < 25) return `<div class="veredito x">⚠️ Margem baixa (${arred(m)}% antes de anúncios). Sobra pouco para pagar tráfego.</div>`;
  if (m < 35) return `<div class="veredito a">🟡 Margem razoável (${arred(m)}%). Dá para testar, mas com anúncio barato.</div>`;
  return `<div class="veredito v">✅ Boa margem (${arred(m)}% antes de anúncios). Pode gastar até ${eur(l.anuncioMax)} em anúncio por venda e ainda não ter prejuízo.</div>`;
}

// ---------- telas ----------
const ESTADOS = ['Ideia', 'Aprovado', 'Na loja', 'Descartado'];
const TELAS = {}, LIGAR = {};

const LANCAMENTO = [
  ['tema', 'Publicar o tema final da loja (cópia compacta)'],
  ['senha', 'Traduzir a página de senha e, no fim, tirar a senha da loja'],
  ['prod10', 'Ter pelo menos 10 produtos na loja'],
  ['colecoes', 'Todos os produtos nas coleções Cães ou Gatos'],
  ['pixel', 'Instalar o pixel (Facebook e Instagram, TikTok, Google)'],
  ['meta', 'Criar a conta de anúncios da Meta'],
  ['merchant', 'Atualizar o Google Merchant (e-mail suporte@leunapets.com)'],
  ['teste', 'Combinar o valor do teste de anúncios (o dono aprova o gasto)'],
];

TELAS.painel = () => {
  const gasto = D.camp.reduce((s, c) => s + num(c.gasto), 0), receita = D.camp.reduce((s, c) => s + num(c.receita), 0), vendas = D.camp.reduce((s, c) => s + num(c.vendas), 0);
  const roas = gasto > 0 ? arred(receita / gasto) : 0;
  const por = (e) => D.meus.filter((m) => m.status === e).length;
  const feitos = LANCAMENTO.filter(([k]) => D.feito[k]).length;
  const plat = ['meta', 'tiktok', 'google'].map((p) => {
    const l = D.camp.filter((c) => c.plataforma === p), g = l.reduce((s, c) => s + num(c.gasto), 0), r = l.reduce((s, c) => s + num(c.receita), 0);
    return { p, g, r, v: l.reduce((s, c) => s + num(c.vendas), 0) };
  });
  const nomes = { meta: 'Facebook e Instagram', tiktok: 'TikTok', google: 'Google' };
  return `<h2>Painel</h2><p class="sub">Tudo da LeunaPets num só lugar.</p>
  <div class="grade g4">
    <div class="kpi"><small>Produtos em teste</small><b>${por('Ideia') + por('Aprovado')}</b></div>
    <div class="kpi r"><small>Na loja</small><b>${por('Na loja')}</b></div>
    <div class="kpi"><small>Gasto em anúncios</small><b>${eur(gasto)}</b></div>
    <div class="kpi v"><small>Retorno (ROAS)</small><b>${roas ? roas.toFixed(2) + '×' : '—'}</b></div>
  </div>
  <div class="grade g2" style="margin-top:16px">
    <div class="card"><h3>Tráfego pago por plataforma</h3>
      <div class="tabela"><table><tr><th>Plataforma</th><th class="n">Gasto</th><th class="n">Vendas</th><th class="n">Receita</th><th class="n">ROAS</th></tr>
      ${plat.map((x) => `<tr><td><a href="#" data-ir="${x.p}">${nomes[x.p]}</a></td><td class="n">${eur(x.g)}</td><td class="n">${x.v}</td><td class="n">${eur(x.r)}</td><td class="n">${x.g > 0 ? (x.r / x.g).toFixed(2) + '×' : '—'}</td></tr>`).join('')}
      </table></div>
      <p class="nota">Os números dos anúncios são os que você registra em cada plataforma (${vendas} venda(s) registradas). A ligação automática com as contas de anúncios vem depois.</p>
    </div>
    <div class="card check"><h3>Antes de vender (${feitos}/${LANCAMENTO.length})</h3>
      <div class="barra"><i style="width:${feitos / LANCAMENTO.length * 100}%"></i></div>
      ${LANCAMENTO.map(([k, t]) => `<label class="${D.feito[k] ? 'feito' : ''}"><input type="checkbox" data-feito="${k}" ${D.feito[k] ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    </div>
  </div>
  <div class="card"><h3>Seus dados</h3><p class="nota">Este app guarda a lista neste navegador. Faça uma cópia de vez em quando.</p>

const OCR_CACHE = 'leunapets_ocr_v3';
let ocrCache = {}; try { ocrCache = JSON.parse(localStorage.getItem(OCR_CACHE) || '{}') || {}; } catch {}
const ocrSalvar = () => { try { const k = Object.keys(ocrCache); if (k.length > 3000) k.slice(0, 1000).forEach((x) => delete ocrCache[x]); localStorage.setItem(OCR_CACHE, JSON.stringify(ocrCache)); } catch {} };
let ocrWorker = null, ocrCarregando = null;
function ocrScript() {
  return new Promise((ok, falha) => {
    if (window.Tesseract) return ok();
    const t = document.createElement('script'); t.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    t.onload = () => ok(); t.onerror = () => falha(new Error('script')); document.head.appendChild(t);
  });
}
/** Prepara o leitor (baixa uma vez e fica guardado no navegador). Devolve true/false. */
async function ocrPreparar(aviso) {
  if (ocrWorker) return true;
  if (!ocrCarregando) ocrCarregando = (async () => {
    await ocrScript();
    try { ocrWorker = await window.Tesseract.createWorker(['eng', 'chi_sim']); }
    catch { ocrWorker = await window.Tesseract.createWorker('eng'); }
    return true;
  })().catch(() => { ocrCarregando = null; return false; });
  if (aviso) aviso('Preparando o leitor de letras (só na primeira vez, pode levar 1 minuto)…');
  return ocrCarregando;
}
/** Decide se o resultado da leitura parece ter letras de verdade (descarta ruído de textura e de tecido). */
function ocrTemLetras(dados) {
  // Só conta palavra que parece palavra de verdade: bem lida, só letras, com vogal e sem letra repetida 3 vezes (descarta ruído de tecido).
  const parece = (t) => /^[A-Za-zÀ-ÿ]{3,}[.,!?:;]?$/.test(t) && /[aeiouáéíóúãõâêôAEIOU]/.test(t) && !/(.)\1\1/i.test(t);
  const palavras = (dados?.words || []).filter((w) => (w.confidence ?? 0) >= 70);
  const latinas = palavras.filter((w) => parece(String(w.text || '').trim()));
  const chinesas = palavras.reduce((n, w) => n + (String(w.text || '').match(/[\u3400-\u9fff]/g) || []).length, 0);
  return latinas.length >= 2 || chinesas >= 3;
}
/** true = tem letras, false = limpa, null = não deu para ler a foto. Guarda o resultado para não ler de novo. */
async function fotoTemLetras(url, chave) {
  if (chave && chave in ocrCache) return ocrCache[chave];
  try {
    const r = await fetch('/loja-api/dono/foto?u=' + encodeURIComponent(url), { credentials: 'same-origin' });
    if (!r.ok) return null;
    const { data } = await ocrWorker.recognize(await r.blob());
    const v = ocrTemLetras(data);
    if (chave) { ocrCache[chave] = v; ocrSalvar(); }
    return v;
  } catch { return null; }
}

async function lojaCarregarEstado() { const r = await api('shopify/estado').catch(() => null); lojaEstado = r?.ok ? r.j : { ligada: false, erroLer: true }; }

/** Cria as opções de cor/tamanho da CJ em cada produto da loja e põe a foto de cada cor. Pode repetir sem problema. */
async function lojaAtivarVariantes() {
  const b = $('#lj-variantes'), m = $('#lj-var-msg'); if (!b) return;
  const lista = lojaLista.itens.filter((p) => p.cj); if (!lista.length) { m.innerHTML = '<div class="nota">Nenhum produto da CJ na loja.</div>'; return; }
  b.disabled = true; let novas = 0, fotos = 0, semOpcao = 0, falhas = 0;
  for (let i = 0; i < lista.length; i++) {
    m.innerHTML = `<div class="aviso" style="margin:8px 0">Produto ${i + 1} de ${lista.length}: ${esc(lista[i].titulo.slice(0, 40))}… <b>Não saia desta tela.</b></div>`;
    let r = await api('shopify/variantes', { pid: lista[i].cj }).catch(() => null);
    if (r?.status === 429) { await espera(6000); r = await api('shopify/variantes', { pid: lista[i].cj }).catch(() => null); }
    if (r?.ok) { if (r.j.sem_opcoes) semOpcao++; else { if (r.j.criadas) novas++; fotos += r.j.fotos || 0; } } else falhas++;
    await espera(1300);
  }
  b.disabled = false;
  m.innerHTML = `<div class="aviso" style="margin:8px 0">✅ ${novas} produtos ganharam opções, ${fotos} fotos de cores ligadas${semOpcao ? `, ${semOpcao} não têm opções na CJ` : ''}${falhas ? `, <b>${falhas} falharam</b>` : ''}. Diga ao Claude: terminou.</div>`;
  lojaCarregarLista();
}

// Botão "Enviar para a loja" do ranking da CJ.
/** Cães, Gatos ou os dois: só fala de gato = Gatos; só fala de cão = Cães; neutro ou os dois = Cães e Gatos. */
function tipoDoProduto(nome) {
  const gato = /\b(cat|cats|kitten|kitty|feline)\b/i.test(nome), cao = /\b(dog|dogs|puppy|puppies|canine)\b/i.test(nome);
  return gato && !cao ? 'Gatos' : cao && !gato ? 'Cães' : 'Ambos';
}
/** Envia vários produtos de uma vez como rascunho, tirando sozinho as fotos com letras. */
async function enviarLote(lista) {
  if (!lista.length) return;
  const el = () => $('#lote-msg'), msg = (t, ok) => { if (el()) el().innerHTML = `<div class="${ok ? 'aviso' : 'nota'}" style="margin:8px 0">${t}</div>`; };
  if (!lojaEstado) await lojaCarregarEstado();
  if (!lojaEstado.ligada) { alert('Primeiro ligue a sua loja: menu “Minha loja”.'); return ir('loja'); }
  const b = $('#rank-lote'); if (b) b.disabled = true;
  msg('Preparando o leitor de letras (só na primeira vez, pode levar 1 minuto)…');
  const prontas = await ocrPreparar();
  let certos = 0, falhas = 0, semFoto = 0, descartadasTotal = 0, puladas = 0;
  for (let i = 0; i < lista.length; i++) {
    const it = lista[i];
    msg(`Enviando ${i + 1} de ${lista.length}: ${esc(it.nome.slice(0, 50))}…`);
    const corpo = { pid: it.pid, titulo: it.nome.slice(0, 120), preco: it.preco, tipo: tipoDoProduto(it.nome) };
    if (prontas) {
      let f = await api('cj/fotos', { pid: it.pid }).catch(() => null);
      if (f?.status === 429) { await espera(6000); f = await api('cj/fotos', { pid: it.pid }).catch(() => null); }
      if (f?.ok) {
        const limpas = [];
        for (const u of f.j.fotos) { const t = await fotoTemLetras(u, 'cj:' + u); if (t === true) descartadasTotal++; else limpas.push(u); }
        corpo.fotos = limpas;
      }
    }
    if (Array.isArray(corpo.fotos) && !corpo.fotos.length) { puladas++; continue; }
    let r = await api('shopify/enviar', corpo).catch(() => null);
    if (r?.status === 429) { await espera(6000); r = await api('shopify/enviar', corpo).catch(() => null); }
    if (r?.ok) {
      certos++; if (!r.j.fotos) semFoto++;
      D.enviados[it.pid] = r.j.admin;
      if (!D.meus.some((m) => m.pid === it.pid)) D.meus.push({ id: novoId(), pid: it.pid, titulo: it.nome, foto: it.foto || '', precoVenda: String(it.preco), custo: String(it.custo), frete: String(it.frete), status: 'Na loja', nota: 'Rascunho enviado à Shopify', link: '', loja: 'CJ', cjLink: '' });
      salvar();
    } else if (r?.j?.erro === 'ja_enviado') { D.enviados[it.pid] = r.j.admin; salvar(); } else falhas++;
    await espera(800);
  }
  cjRank.sel = new Set(); cjRankDesenhar();
  msg(`✅ ${certos} enviados como rascunho${descartadasTotal ? `, ${descartadasTotal} fotos com letras descartadas` : ''}${puladas ? `, <b>${puladas} pulados porque ficaram sem nenhuma foto limpa</b>` : ''}${semFoto ? `, <b>${semFoto} sem nenhuma foto</b>` : ''}${falhas ? `, <b>${falhas} falharam</b>` : ''}. Diga ao Claude: terminou.`, true);
}
async function enviarParaLoja(it) {

    <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:8px"><input id="en-ocr" type="checkbox" checked style="width:auto;margin-top:3px"> <span>🤖 Tirar sozinho as fotos que têm letras<br><small class="nota">Demora um pouco mais, mas a loja fica só com fotos limpas.</small></span></label>
    <div class="erro" id="en-erro"></div><div class="linha" style="margin-top:8px"><button class="btn fixo" id="en-ok">Enviar</button><button class="btn sec fixo" id="en-x">Cancelar</button></div>`;
  document.body.appendChild(dlg); dlg.showModal();

    const b = $('#en-ok'); b.disabled = true; b.textContent = 'Enviando…'; $('#en-erro').textContent = '';

    let descartadas = 0;

      const msg = (t) => { b.textContent = t.length > 40 ? 'Preparando…' : t; $('#en-erro').style.color = 'var(--cinza,#555)'; $('#en-erro').textContent = t; };
      const lista = await api('cj/fotos', { pid: it.pid }).catch(() => null);
      const prontas = await ocrPreparar(msg);
      if (!lista?.ok || !prontas) {
        $('#en-erro').style.color = ''; b.disabled = false; b.textContent = 'Enviar';
        if (!confirm('Não consegui ler as letras das fotos agora. Enviar todas as fotos mesmo assim? (Depois você pode limpar em 🖼 Fotos.)')) { $('#en-erro').textContent = ''; return; }
        b.disabled = true; b.textContent = 'Enviando…';
      } else {
        const limpas = [];
        for (let i = 0; i < lista.j.fotos.length; i++) {
          msg(`Lendo a foto ${i + 1} de ${lista.j.fotos.length}…`);
          const t = await fotoTemLetras(lista.j.fotos[i], 'cj:' + lista.j.fotos[i]);
          if (t === true) descartadas++; else limpas.push(lista.j.fotos[i]);
        }
        corpo.fotos = limpas; b.textContent = 'Enviando…'; $('#en-erro').style.color = ''; $('#en-erro').textContent = '';
      }
    }
    if (Array.isArray(corpo.fotos) && !corpo.fotos.length) { $('#en-erro').style.color = ''; $('#en-erro').textContent = 'Todas as fotos têm letras, então não enviei. Procure outro produto.'; const bb = $('#en-ok'); bb.disabled = false; bb.textContent = 'Enviar'; return; }

    if (r?.ok) {
      const av = r.j.avisos || [];
      dlg.innerHTML = `<h3 style="margin:0 0 8px">✅ Enviado como rascunho</h3><p>${r.j.fotos} foto(s) enviada(s)${descartadas ? `, ${descartadas} com letras descartada(s)` : ''}.${r.j.fotos === 0 ? ' <b>Atenção:</b> nenhuma foto passou. Ponha as fotos na mão na Shopify.' : ''}${av.includes('preco') ? ' <b>Atenção:</b> confira o preço na Shopify.' : ''}${av.includes('colecao') ? ' Não achei a coleção, coloque na mão.' : ''}</p>
        <div class="linha"><a class="btn fixo" href="${esc(r.j.admin)}" target="_blank" rel="noopener">Abrir na loja ↗</a><button class="btn sec fixo" id="en-fim">Fechar</button></div>`;
      $('#en-fim').addEventListener('click', () => dlg.close());
      if (!av.length && r.j.fotos > 0) setTimeout(() => { if (dlg.open) dlg.close(); }, 1800);
      D.enviados[it.pid] = r.j.admin; salvar(); if (vista === 'fornecedor') cjRankDesenhar();
      if (!D.meus.some((m) => m.pid === it.pid)) { D.meus.push({ id: novoId(), pid: it.pid, titulo: it.nome, foto: it.foto || '', precoVenda: String(it.preco), custo: String(it.custo), frete: String(it.frete), status: 'Na loja', nota: 'Rascunho enviado à Shopify', link: '', loja: 'CJ', cjLink: '' }); salvar(); }
      return;
    }
    b.disabled = false; b.textContent = 'Enviar';
    if (r?.j?.erro === 'ja_enviado') { D.enviados[it.pid] = r.j.admin; salvar(); cjRankDesenhar(); $('#en-erro').innerHTML = `Este produto já está na loja. <a href="${esc(r.j.admin)}" target="_blank" rel="noopener">Abrir ↗</a>`; }

}

const fotoChave = (f) => 'sh:' + f.media;

async function fotosCarregar() {
  fotosEstado = { ...fotosEstado, carregando: true, msg: '' }; fotosDesenhar();
  const r = await api('shopify/fotos', {}).catch(() => null);
  if (r?.ok) { fotosEstado.itens = r.j.fotos; fotosEstado.msg = ''; fotosEstado.marcadas = new Set(r.j.fotos.filter((f) => ocrCache[fotoChave(f)] === true).map((f) => f.media)); }
  else fotosEstado.msg = lojaErros[r?.j?.erro] || 'Não deu para ler as fotos agora.';
  fotosEstado.carregando = false; fotosDesenhar();
}
function fotosDesenhar() {
  const el = $('#fotos-area'); if (!el) return;
  const E = fotosEstado;

  const lidas = E.itens.filter((f) => fotoChave(f) in ocrCache && ocrCache[fotoChave(f)] !== null).length;
  const grade = (l) => `<div class="fotos-grade">${l.map((f) => `<label class="foto-card${E.marcadas.has(f.media) ? ' marcada' : ''}"><img src="${esc(f.url)}&width=300" loading="lazy" alt=""><input type="checkbox" data-foto="${esc(f.media)}" ${E.marcadas.has(f.media) ? 'checked' : ''}><small>${esc(f.titulo.slice(0, 28))}${f.status === 'DRAFT' ? ' · rascunho' : ''}</small></label>`).join('')}</div>`;
  el.innerHTML = `<div class="card">
    ${E.carregando ? '<p class="nota">Lendo a loja…</p>' : E.msg ? `<div class="erro">${esc(E.msg)}</div>` : `<p><b>${E.itens.length}</b> foto(s) na loja · <b>${lidas}</b> já lidas pelo robô · <b>${marcadas.length}</b> marcadas para apagar</p>`}

    <div class="erro" id="fo-erro"></div>
    ${E.lendo ? `<div class="barra"><i style="width:${E.total ? E.feito / E.total * 100 : 0}%"></i></div>` : ''}
  </div>
  ${E.itens.length ? `<div class="card" style="border-color:var(--verm)"><h3>🗑 Marcadas para apagar (${marcadas.length})</h3>${marcadas.length ? `<p class="nota">O robô marca as que têm letras. Desmarque as que quiser manter.</p>${grade(marcadas)}` : '<p class="nota">Nenhuma marcada. Toque numa foto lá embaixo para marcar na mão.</p>'}
    <div class="linha" style="margin-top:10px"><button class="btn verm fixo" id="fo-apagar" ${E.apagando || !marcadas.length ? 'disabled' : ''}>${E.apagando ? 'Apagando…' : `🗑 Apagar marcadas (${marcadas.length})`}</button></div></div>
  <div class="card"><h3>Outras fotos (${outras.length})</h3><p class="nota">Toque numa foto para marcar na mão se achar que tem letras. Ela sobe para o quadro de cima.</p>${grade(outras)}</div>` : ''}`;
  el.querySelectorAll('[data-foto]').forEach((c) => c.addEventListener('change', () => { c.checked ? E.marcadas.add(c.dataset.foto) : E.marcadas.delete(c.dataset.foto); const f = E.itens.find((x) => x.media === c.dataset.foto); if (f) { ocrCache[fotoChave(f)] = c.checked; ocrSalvar(); } fotosDesenhar(); }));
  $('#fo-atualizar')?.addEventListener('click', fotosCarregar);
  $('#fo-parar')?.addEventListener('click', () => { E.parar = true; });
  $('#fo-ler')?.addEventListener('click', fotosLer);
  $('#fo-de-novo')?.addEventListener('click', () => { E.itens.forEach((f) => delete ocrCache[fotoChave(f)]); ocrSalvar(); fotosLer(); });
  $('#fo-apagar')?.addEventListener('click', fotosApagar);
}
async function fotosLer() {
  const E = fotosEstado, erro = (t) => { const e = $('#fo-erro'); if (e) e.textContent = t; };
  const alvo = E.itens.filter((f) => !(fotoChave(f) in ocrCache) || ocrCache[fotoChave(f)] === null);
  if (!alvo.length) return erro('Todas as fotos já foram lidas.');
  E.lendo = true; E.parar = false; E.feito = 0; E.total = alvo.length; fotosDesenhar(); erro('Preparando o leitor de letras (só na primeira vez, pode levar 1 minuto)…');
  if (!(await ocrPreparar())) { E.lendo = false; fotosDesenhar(); return erro('Não consegui carregar o leitor de letras. Confira a internet e tente de novo. Você ainda pode marcar as fotos na mão.'); }
  erro('');
  for (const f of alvo) {
    if (E.parar) break;
    const t = await fotoTemLetras(f.url, fotoChave(f));
    if (t === true) E.marcadas.add(f.media);
    E.feito++; if (E.feito % 2 === 0 || E.feito === E.total) fotosDesenhar();
  }
  E.lendo = false; fotosDesenhar();
}
async function fotosApagar() {
  const E = fotosEstado; const sel = E.itens.filter((f) => E.marcadas.has(f.media));
  if (!sel.length || !confirm(`Apagar ${sel.length} foto(s) da loja? Isso não pode ser desfeito.`)) return;
  E.apagando = true; fotosDesenhar();
  let apagadas = 0, falhas = 0, erroGeral = '';
  for (let i = 0; i < sel.length; i += 100) {
    const r = await api('shopify/fotos-apagar', { itens: sel.slice(i, i + 100).map((f) => ({ produto: f.produto, media: f.media })) }).catch(() => null);
    if (r?.ok) { apagadas += r.j.apagadas; falhas += r.j.falhas; } else { erroGeral = lojaErros[r?.j?.erro] || 'Não deu para apagar agora.'; break; }
  }
  E.apagando = false;
  await fotosCarregar();
  const e = $('#fo-erro'); if (e) { e.style.color = erroGeral ? '' : 'var(--verde,#157347)'; e.textContent = erroGeral || `${apagadas} foto(s) apagada(s)${falhas ? `, ${falhas} não deu` : ''}.`; }
}

// ----- Tráfego pago (uma tela para cada plataforma) -----
const PLAT = {
  meta: { nome: 'Facebook e Instagram', icone: '📘', dica: 'A Meta é a nossa primeira escolha: aceita anunciante do Brasil mirando Portugal. Comece com orçamento pequeno e só gaste com a sua aprovação.',
    atalhos: [['Biblioteca de Anúncios (Portugal, ativos)', 'Veja o que outras lojas anunciam agora', 'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=PT&q=c%C3%A3es&search_type=keyword_unordered&media_type=all'],
      ['Biblioteca: gatos', 'Mesma busca para gatos', 'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=PT&q=gatos&search_type=keyword_unordered&media_type=all'],
      ['Gerenciador de Anúncios', 'Sua conta de anúncios', 'https://adsmanager.facebook.com/'], ['Gerenciador de Eventos (pixel)', 'Confira se o pixel dispara', 'https://business.facebook.com/events_manager2/']] },
  tiktok: { nome: 'TikTok', icone: '🎵', dica: 'O TikTok pode exigir verificação do anunciante e da região. Antes de gastar, confirme que a conta de anúncios aceita você e que o pagamento funciona.',
    atalhos: [['Top Ads (Portugal)', 'Anúncios mais vistos', 'https://ads.tiktok.com/business/creativecenter/inspiration/topads/pc/pt?region=PT'],
      ['Produtos em alta', 'O que está a bombar', 'https://ads.tiktok.com/business/creativecenter/top-products/pc/pt?region=PT'], ['TikTok Ads Manager', 'Sua conta de anúncios', 'https://ads.tiktok.com/'], ['TikTok Shop / vídeos', 'Pesquisar tendências de cães e gatos', 'https://www.tiktok.com/search?q=produtos%20para%20c%C3%A3es']] },
  google: { nome: 'Google', icone: '🔍', dica: 'O Google Shopping precisa do Merchant Center aprovado. Depois que as vendas começarem, ele costuma trazer clientes com mais intenção de compra.',
    atalhos: [['Google Trends (Portugal)', 'Veja se o interesse sobe ou desce', 'https://trends.google.com/trends/explore?geo=PT&q=coleira%20para%20c%C3%A3es'], ['Merchant Center', 'Catálogo e aprovação de produtos', 'https://merchants.google.com/'],
      ['Google Ads', 'Sua conta de anúncios', 'https://ads.google.com/'], ['Planeador de palavras-chave', 'Quanto se procura por mês', 'https://ads.google.com/home/tools/keyword-planner/']] },
};
for (const k of Object.keys(PLAT)) {
  TELAS[k] = () => {
    const P = PLAT[k], l = D.camp.filter((c) => c.plataforma === k).sort((a, b) => b.data.localeCompare(a.data));
    const g = l.reduce((s, c) => s + num(c.gasto), 0), v = l.reduce((s, c) => s + num(c.vendas), 0), r = l.reduce((s, c) => s + num(c.receita), 0);
    const aprov = D.meus.filter((m) => m.status !== 'Descartado' && m.precoVenda && m.custo);
    const media = aprov.length ? aprov.reduce((s, m) => s + lucro({ preco: m.precoVenda, custo: m.custo, frete: m.frete }).antes, 0) / aprov.length : 0;
    const cpa = v ? g / v : 0;
    return `<h2>${P.icone} ${P.nome}</h2><p class="sub">${esc(P.dica)}</p>
    <div class="grade g4"><div class="kpi"><small>Gasto</small><b>${eur(g)}</b></div><div class="kpi r"><small>Vendas</small><b>${v}</b></div><div class="kpi"><small>Receita</small><b>${eur(r)}</b></div><div class="kpi v"><small>ROAS</small><b>${g > 0 ? (r / g).toFixed(2) + '×' : '—'}</b></div></div>
    ${v && media ? `<div class="veredito ${cpa <= media ? 'v' : 'x'}" style="margin-top:14px">${cpa <= media ? '✅' : '⚠️'} Cada venda custa ${eur(cpa)} em anúncio; o lucro médio dos seus produtos antes de anúncios é ${eur(media)}.</div>` : ''}
    <div class="card" style="margin-top:16px"><h3>Pesquisar e abrir</h3><div class="atalhos">${P.atalhos.map(([t, s, u]) => `<a class="atalho" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}<small>${esc(s)}</small></a>`).join('')}</div></div>
    <div class="card"><h3>Registrar resultados</h3><div class="linha"><div><label>Dia</label><input type="date" id="p-data" value="${new Date().toISOString().slice(0, 10)}"></div>
      <div><label>Gasto (€)</label><input id="p-gasto" inputmode="decimal"></div><div><label>Vendas</label><input id="p-vendas" inputmode="numeric"></div><div><label>Receita (€)</label><input id="p-receita" inputmode="decimal"></div>
      <div style="flex:2 1 200px"><label>Nota (produto, vídeo…)</label><input id="p-nota"></div><button class="btn fixo" id="p-add">Registrar</button></div>
      <div class="tabela" style="margin-top:10px"><table><tr><th>Dia</th><th class="n">Gasto</th><th class="n">Vendas</th><th class="n">Receita</th><th>Nota</th><th></th></tr>
      ${l.map((c) => `<tr><td>${esc(c.data)}</td><td class="n">${eur(num(c.gasto))}</td><td class="n">${num(c.vendas)}</td><td class="n">${eur(num(c.receita))}</td><td>${esc(c.nota)}</td><td><button class="btn peq verm" data-rm="${c.id}">×</button></td></tr>`).join('') || '<tr><td colspan="6" class="nota">Nada registrado ainda.</td></tr>'}</table></div>
      <p class="nota">Por enquanto você digita os números do painel de cada plataforma. A leitura automática dessas contas fica para a próxima versão.</p></div>`;
  };
  LIGAR[k] = () => {
    $('#p-add').addEventListener('click', () => {
      if (!$('#p-gasto').value && !$('#p-vendas').value) return;
      D.camp.push({ id: novoId(), plataforma: k, data: $('#p-data').value, gasto: num($('#p-gasto').value), vendas: num($('#p-vendas').value), receita: num($('#p-receita').value), nota: $('#p-nota').value.slice(0, 120) });
      salvar(); refazer();
    });
    document.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { D.camp = D.camp.filter((c) => c.id !== b.dataset.rm); salvar(); refazer(); }));
  };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/leunapets/sw.js').catch(() => {});
iniciar();
</script>

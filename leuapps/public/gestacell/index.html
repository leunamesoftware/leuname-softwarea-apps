<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gestacell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545;
  --navy-2:#0E2F5A;
  --blue:#1E6FD9;
  --blue-dark:#175BB5;
  --blue-light:#EAF2FE;
  --blue-lighter:#F5F9FF;
  --amber-mark:#F4A100;
  --gray-25:#FAFBFD;
  --gray-50:#F3F6FA;
  --gray-100:#E9EEF4;
  --gray-200:#DCE3EC;
  --gray-400:#9AA7B8;
  --gray-600:#5B6B7F;
  --gray-800:#28323F;
  --white:#FFFFFF;
  --green:#17A85E;
  --green-bg:#E7F8EF;
  --amber:#C87A00;
  --amber-bg:#FFF3DF;
  --red:#D6394A;
  --red-bg:#FCEAEC;
  --font-head:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:16px;
  --shadow-card:0 1px 2px rgba(11,37,69,.06), 0 1px 10px rgba(11,37,69,.04);
  --shadow-pop:0 12px 32px rgba(11,37,69,.18);
}
:root:not([data-theme="light"]){
  /* dark scheme mirrors light for this business tool; kept legible if OS prefers dark */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --gray-25:#0F1620; --gray-50:#121B27; --gray-100:#1A2532; --gray-200:#243040;
    --gray-400:#7C8AA0; --gray-600:#AAB6C6; --gray-800:#EDF1F6; --white:#182333;
    --blue-lighter:#16243A; --blue-light:#173A63;
  }
}
:root[data-theme="dark"]{
  --gray-25:#0F1620; --gray-50:#121B27; --gray-100:#1A2532; --gray-200:#243040;
  --gray-400:#7C8AA0; --gray-600:#AAB6C6; --gray-800:#EDF1F6; --white:#182333;
  --blue-lighter:#16243A; --blue-light:#173A63;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--gray-50);
  color:var(--gray-800);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;color:var(--gray-800);}
a{color:var(--blue);text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);color:var(--gray-800);}
/* Campos e listas seguem o tema: no escuro o texto fica claro e a lista nativa também escura. */
option{background:var(--white);color:var(--gray-800);}
:root[data-theme="dark"]{color-scheme:dark;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;}}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:8px;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

/* ---------- layout shell ---------- */
#app-root{display:none;height:100vh;}
#app-root.ready{display:flex;}
.sidebar{
  width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#fff;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
  transition:transform .2s ease;z-index:40;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.brand-mark{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-word{font-family:var(--font-head);font-weight:800;font-size:16.5px;letter-spacing:.2px;line-height:1.05;}
.brand-word span{display:block;font-weight:600;font-size:10.5px;letter-spacing:1.5px;color:#9FC0F0;}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#C6D6EC;font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item svg{flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6C86AC;padding:14px 12px 6px;font-weight:700;}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
.sync-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:9px 10px;font-size:12px;color:#C6D6EC;cursor:pointer;border:none;width:100%;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot.green{background:var(--green);box-shadow:0 0 0 3px rgba(23,168,94,.18);}
.dot.amber{background:var(--amber);box-shadow:0 0 0 3px rgba(200,122,0,.18);}
.dot.red{background:var(--red);box-shadow:0 0 0 3px rgba(214,57,74,.18);}
.dot.gray{background:#8AA0BE;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;}
.topbar{
  height:62px;flex:none;background:var(--white);border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:30;
}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--gray-200);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--gray-600);flex:none;position:relative;}
.icon-btn:hover{background:var(--gray-50);}
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--gray-200);background:var(--gray-50);font-size:13.5px;color:var(--gray-800);}
.search-wrap input:focus{background:var(--white);}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);}
.search-results{position:absolute;top:44px;left:0;right:0;background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-m);box-shadow:var(--shadow-pop);max-height:420px;overflow-y:auto;z-index:50;padding:6px;display:none;}
.search-results.show{display:block;}
.sr-group-label{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 4px;}
.sr-item{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;}
.sr-item:hover{background:var(--gray-50);}
.sr-item b{font-weight:600;font-size:13px;}
.sr-item small{color:var(--gray-400);font-size:11.5px;}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.store-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--gray-200);border-radius:10px;background:var(--gray-50);font-size:12.5px;}
.store-chip .ic{width:24px;height:24px;border-radius:6px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;}
.badge-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:10px;border:1px solid var(--gray-200);cursor:pointer;background:var(--white);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none;}

.content{flex:1;overflow-y:auto;padding:22px 24px 60px;}
.content-inner{max-width:1220px;margin:0 auto;}

.mobile-topbar{display:none;}
.mobile-tabbar{display:none;}

/* ---------- generic UI ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-head p{color:var(--gray-600);font-size:13px;margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font-size:13.5px;font-weight:600;background:var(--gray-100);color:var(--gray-800);white-space:nowrap;}
.btn:hover{filter:brightness(.98);}
.btn.primary{background:var(--blue);color:#fff;}
.btn.primary:hover{background:var(--blue-dark);}
.btn.success{background:var(--green);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn.outline{background:var(--white);border-color:var(--gray-200);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--gray-600);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.kpi-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow-card);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.kpi-label{color:var(--gray-600);font-size:12.5px;font-weight:600;}
.kpi-value{font-family:var(--font-head);font-size:23px;font-weight:800;margin-top:2px;}
.kpi-delta{font-size:11.5px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--green);}
.kpi-delta.down{color:var(--red);}
.kpi-delta.warn{color:var(--amber);}

.panel{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-m);box-shadow:var(--shadow-card);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--gray-100);}
.panel-head h3{font-size:14.5px;}
.panel-body{padding:16px 17px;}
.panel-body.pad0{padding:0;}

.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;}
.two-col>*{min-width:0;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--gray-600);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:10px 14px;border-bottom:1px solid var(--gray-100);background:var(--gray-25);}
td{padding:11px 14px;border-bottom:1px solid var(--gray-50);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--gray-25);}
.table-wrap{overflow-x:auto;}
.empty-state{padding:44px 20px;text-align:center;color:var(--gray-400);}
.empty-state svg{margin-bottom:10px;opacity:.5;}
.empty-state h4{color:var(--gray-600);margin-bottom:4px;font-size:14px;}
.empty-state p{font-size:12.5px;max-width:320px;margin:0 auto;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.chip.blue{background:var(--blue-light);color:var(--blue-dark);}
.chip.green{background:var(--green-bg);color:var(--green);}
.chip.amber{background:var(--amber-bg);color:var(--amber);}
.chip.red{background:var(--red-bg);color:var(--red);}
.chip.gray{background:var(--gray-100);color:var(--gray-600);}
.chip.purple{background:#F1E9FE;color:#7C3AED;}

.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--gray-50);}
.list-row:last-child{border-bottom:none;}
.list-ic{width:32px;height:32px;border-radius:8px;background:var(--gray-50);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gray-600);}
.list-main{flex:1;min-width:0;}
.list-main b{font-size:13px;font-weight:600;display:block;}
.list-main small{color:var(--gray-400);font-size:11.5px;}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.form-grid.c3{grid-template-columns:repeat(3,1fr);}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px;}
.field.span2{grid-column:span 2;}
.field.span3{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--gray-600);}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--gray-200);border-radius:9px;font-size:13.5px;background:var(--white);color:var(--gray-800);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}
.field small.hint{color:var(--gray-400);font-size:11px;}
.field.check{flex-direction:row;align-items:center;gap:8px;}
.field.check input{width:16px;height:16px;}

.modal-overlay{position:fixed;inset:0;background:rgba(11,20,35,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:4vh 16px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:var(--white);border-radius:var(--radius-l);width:100%;max-width:640px;box-shadow:var(--shadow-pop);margin-top:2vh;}
.modal.wide{max-width:880px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--gray-100);}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:15px 20px;border-top:1px solid var(--gray-100);}
.x-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--gray-50);color:var(--gray-600);display:flex;align-items:center;justify-content:center;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--gray-800);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:9px;min-width:220px;animation:toastin .18s ease;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.toast.info{background:var(--navy);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-100);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:10px 14px;font-size:13px;font-weight:600;color:var(--gray-600);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--blue);border-color:var(--blue);}

.status-track{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px;}
.status-step{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--gray-100);color:var(--gray-400);}
.status-step.done{background:var(--blue-light);color:var(--blue-dark);}
.status-step.current{background:var(--blue);color:#fff;}

.search-toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-toolbar input[type=text],.search-toolbar select{padding:9px 12px;border:1px solid var(--gray-200);border-radius:9px;font-size:13px;background:var(--white);}
.search-toolbar input[type=text]{flex:1;min-width:180px;}

.progress-bar{height:6px;background:var(--gray-100);border-radius:99px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--blue);border-radius:99px;}

.print-only{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;padding:0;}
  .print-only{display:block;}
}

.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1200px 600px at 15% -10%, #163A6B 0%, var(--navy) 45%, var(--navy) 100%);padding:20px;}
.auth-card{width:100%;max-width:420px;background:var(--white);border-radius:var(--radius-l);box-shadow:var(--shadow-pop);padding:30px 28px;}
.auth-card.wide{max-width:560px;}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center;}
.auth-steps{display:flex;gap:6px;margin-bottom:20px;}
.auth-steps > div{flex:1;height:4px;border-radius:99px;background:var(--gray-100);}
.auth-steps > div.on{background:var(--blue);}
.logo-drop{border:1.5px dashed var(--gray-200);border-radius:var(--radius-m);padding:16px;text-align:center;cursor:pointer;color:var(--gray-600);font-size:12.5px;}
.logo-drop img{max-height:52px;max-width:100%;margin-bottom:6px;}

.callout{border-radius:var(--radius-m);padding:13px 15px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;}
.callout.info{background:var(--blue-lighter);color:var(--gray-800);border:1px solid var(--blue-light);}
.callout.warn{background:var(--amber-bg);color:#7A4A00;border:1px solid #F1D9AE;}
.callout svg{flex:none;margin-top:1px;}

.divider{height:1px;background:var(--gray-100);margin:14px 0;}
.muted{color:var(--gray-600);}
.small{font-size:12px;}
.right{text-align:right;}
.center{text-align:center;}
.mono{font-variant-numeric:tabular-nums;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.stack-8>*+*{margin-top:8px;}
.stack-12>*+*{margin-top:12px;}
.hidden{display:none !important;}

/* mobile */
@media (max-width: 880px), (orientation: portrait) and (max-width: 1100px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);width:250px;box-shadow:var(--shadow-pop);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;}
  .sidebar-overlay.show{display:block;}
  .main-col{width:100%;}
  .topbar{display:none;}
  .mobile-topbar{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:25;}
  .mobile-topbar .brand-word{font-size:14px;}
  .mobile-topbar{padding-right:112px;} /* espaço do botão "Voltar à loja" no canto */
  .mobile-topbar .brand-word span{color:#9FC0F0;}
  .content{padding:14px 14px 90px;}
  .grid-cards{grid-template-columns:repeat(2,1fr);gap:10px;}
  .two-col,.three-col,.form-grid.c3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .field.span2,.field.span3{grid-column:1/-1;}
  .mobile-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--gray-100);z-index:35;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .mobile-tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--gray-400);font-size:10px;font-weight:600;padding:5px 2px;}
  .mobile-tabbar button.active{color:var(--blue);}
  body{padding-bottom:0;}
  .kpi-value{font-size:19px;}
  .modal{max-width:100%;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:92vh;margin:0;}
  .modal-overlay{align-items:flex-end;padding:0;}
  table{font-size:12.5px;}
  .page-head h2{font-size:18px;}
}
@media (min-width:881px) and (orientation: landscape), (min-width:1101px){
  .desktop-only{display:block;}
  /* "Voltar à loja" no pé do menu lateral: no topo ele cobria o nome do usuário. */
  a[aria-label^="Voltar para Meus apps"]{top:auto !important;right:auto !important;left:14px !important;bottom:96px !important;}
}
@media (max-width:880px), (orientation: portrait) and (max-width: 1100px){
  .desktop-only{display:none !important;}
}
</style>
</head>
<body>

<div id="toast-wrap" class="toast-wrap"></div>
<div id="print-area"></div>

<!-- ========== AUTH / ONBOARDING SCREENS ========== -->
<div id="auth-root"></div>

<!-- ========== APP SHELL ========== -->
<div id="app-root">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <div class="mobile-topbar">
      <button class="icon-btn" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff" id="btn-open-sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

let PATTERN_SEQ=[];
const PATTERN_POS={1:[0,0],2:[1,0],3:[2,0],4:[0,1],5:[1,1],6:[2,1],7:[0,2],8:[1,2],9:[2,2]};
function patternGridSVG(seq,size,interactive){
  size=size||180;
  const pad=size*0.19, gap=(size-2*pad)/2;
  const pt=n=>{ const p=PATTERN_POS[n]; return [pad+p[0]*gap, pad+p[1]*gap]; };
  let lines='';
  for(let i=0;i<seq.length-1;i++){
    const a=pt(seq[i]), b=pt(seq[i+1]);
    lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#1E6FD9" stroke-width="${Math.max(2,size*0.016)}" stroke-linecap="round"/>`;
  }
  let dots='';
  for(let n=1;n<=9;n++){
    const c=pt(n); const idx=seq.indexOf(n); const marked=idx>-1;
    dots+=`<circle data-dot="${n}" cx="${c[0]}" cy="${c[1]}" r="${size*0.078}" fill="${marked?'#1E6FD9':'#fff'}" stroke="#0B2545" stroke-width="${size*0.012}" style="${interactive?'cursor:pointer;':''}"/>`;
    if(marked) dots+=`<text x="${c[0]}" y="${c[1]+size*0.028}" text-anchor="middle" font-size="${size*0.065}" font-family="Arial" fill="#fff" font-weight="700" style="pointer-events:none;">${idx+1}</text>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${lines}${dots}</svg>`;
}
function wirePatternGrid(wrapId,size){
  const wrap=document.getElementById(wrapId);
  if(!wrap) return;
  wrap.innerHTML=patternGridSVG(PATTERN_SEQ,size,true);
  wrap.onclick=(e)=>{
    const dot=e.target.closest('[data-dot]');
    if(!dot) return;
    const n=parseInt(dot.dataset.dot,10);
    if(PATTERN_SEQ.includes(n)) return;
    PATTERN_SEQ.push(n);
    wrap.innerHTML=patternGridSVG(PATTERN_SEQ,size,true);
  };
}

let _dbPromise=null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VERSION); }catch(e){ reject(e); return; }
    req.onupgradeneeded=(ev)=>{
      const db=ev.target.result;
      STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
function idbTx(storeName,mode){ return openDB().then(db=>db.transaction(storeName,mode).objectStore(storeName)); }
function idbAll(storeName){
  return idbTx(storeName,'readonly').then(store=>new Promise((res,rej)=>{
    const r=store.getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  }));
}
function idbGet(storeName,id){
  return idbTx(storeName,'readonly').then(store=>new Promise((res,rej)=>{
    const r=store.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);
  }));
}
function idbPutLocal(storeName,obj){
  return idbTx(storeName,'readwrite').then(store=>new Promise((res,rej)=>{
    const r=store.put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error);
  }));
}
function idbDeleteLocal(storeName,id){
  return idbTx(storeName,'readwrite').then(store=>new Promise((res,rej)=>{
    const r=store.delete(id); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  }));
}
function idbClear(storeName){
  return idbTx(storeName,'readwrite').then(store=>new Promise((res,rej)=>{
    const r=store.clear(); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  }));
}
async function idbPut(storeName,obj){
  if(SYNC_STORES.includes(storeName)){
    obj._syncTs=Date.now();
    await idbPutLocal(storeName,obj);
    await idbPutLocal('_sync_outbox',{id:storeName+'|'+obj.id,store:storeName,registroId:obj.id,payload:obj,atualizadoEm:obj._syncTs,deletado:0});
    syncScheduleSoon();
    return obj;
  }
  return idbPutLocal(storeName,obj);
}
async function idbDelete(storeName,id){
  if(SYNC_STORES.includes(storeName)){
    const ts=Date.now();
    await idbDeleteLocal(storeName,id);
    await idbPutLocal('_sync_outbox',{id:storeName+'|'+id,store:storeName,registroId:id,payload:null,atualizadoEm:ts,deletado:1});
    syncScheduleSoon();
    return true;
  }
  return idbDeleteLocal(storeName,id);
}
// ---- Sincronizacao entre dispositivos que compartilham a mesma licenca ----
// Funciona offline: toda gravacao local entra numa fila (_sync_outbox) e
// vai pro servidor assim que a internet estiver disponivel; o servidor
// guarda por chave de licenca e devolve pra qualquer outro aparelho com a
// mesma chave (ver PROJETO/servidor-licencas-cloudflare/src/index.js).
let _syncInFlight=false;
let _syncTimer=null;
function syncScheduleSoon(){
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{ syncNow().catch(()=>{}); },1500);
}
function syncCursorKey(chave){ return 'leuname_sync_cursor:'+chave; }
function syncGetCursor(chave){ return Number(lsGet(syncCursorKey(chave))||'0')||0; }
function syncSetCursor(chave,ts){ lsSet(syncCursorKey(chave),String(ts)); }
async function syncMigrateExisting(){
  if(lsGet('leuname_sync_migrated_v1')) return;
  for(const s of SYNC_STORES){
    const all=await idbAll(s);
    for(const rec of all){
      if(!rec||!rec.id) continue;
      const ts=rec._syncTs||Date.now();
      rec._syncTs=ts;
      await idbPutLocal(s,rec);
      await idbPutLocal('_sync_outbox',{id:s+'|'+rec.id,store:s,registroId:rec.id,payload:rec,atualizadoEm:ts,deletado:0});
    }
  }
  lsSet('leuname_sync_migrated_v1','1');
}
async function syncPush(){
  const chave=lsGet(LICENSE_LS_KEY);
  if(!chave) return {ok:false};
  const pendentes=await idbAll('_sync_outbox');
  if(!pendentes.length) return {ok:true,enviados:0};
  const alteracoes=pendentes.map(p=>({store:p.store,id:p.registroId,payload:p.payload,atualizado_em:p.atualizadoEm,deletado:p.deletado}));
  let resp;
  try{
    resp=await fetch(SYNC_API_BASE+'/sync/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chave,alteracoes})});
  }catch(e){ return {ok:false,offline:true}; }
  if(!resp.ok) return {ok:false};
  for(const p of pendentes){
    const atual=await idbGet('_sync_outbox',p.id);
    if(atual && atual.atualizadoEm===p.atualizadoEm) await idbDeleteLocal('_sync_outbox',p.id);
  }
  return {ok:true,enviados:pendentes.length};
}
async function syncPull(){
  const chave=lsGet(LICENSE_LS_KEY);
  if(!chave) return {ok:false};
  const desde=syncGetCursor(chave);
  let resp;
  try{
    resp=await fetch(SYNC_API_BASE+'/sync/pull?chave='+encodeURIComponent(chave)+'&desde='+desde);
  }catch(e){ return {ok:false,offline:true}; }
  if(!resp.ok) return {ok:false};
  const data=await resp.json();
  if(!data.ok) return {ok:false};
  let maxTs=desde;
  for(const alt of data.alteracoes){
    if(alt.deletado) await idbDeleteLocal(alt.store,alt.id);
    else if(alt.payload) await idbPutLocal(alt.store,alt.payload);
    if(alt.atualizado_em>maxTs) maxTs=alt.atualizado_em;
  }
  if(maxTs>desde) syncSetCursor(chave,maxTs);
  return {ok:true,recebidos:data.alteracoes.length};
}
async function syncNow(){
  if(_syncInFlight) return {ok:false,jaRodando:true};
  if(typeof navigator!=='undefined' && navigator.onLine===false) return {ok:false,offline:true};
  if(!lsGet(LICENSE_LS_KEY)) return {ok:false};
  _syncInFlight=true;
  try{
    const push=await syncPush();
    const pull=await syncPull();
    if(push.ok||pull.ok) lsSet('leuname_sync_ultimo',nowISO());
    checkLicenseRevoked().then(revoked=>{ if(revoked) renderLicenseRevoked(); });
    return {ok:!!(push.ok&&pull.ok),push,pull};
  } finally { _syncInFlight=false; }
}
async function idbBulkPut(storeName,arr){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(storeName,'readwrite'); const store=tx.objectStore(storeName);
    (arr||[]).forEach(o=>store.put(o));
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function exportAllData(){
  const data={};
  for(const s of STORES){ data[s]=await idbAll(s); }
  return {version:APP_VERSION,exportedAt:nowISO(),app:'leuname_gestao',loja:STATE.loja?STATE.loja.nome:null,data};
}
async function importAllData(payload,mode){
  if(!payload||!payload.data) throw new Error('Arquivo de backup inválido.');
  for(const s of STORES){
    if(!payload.data[s]) continue;
    if(mode==='replace') await idbClear(s);
    await idbBulkPut(s,payload.data[s]);
  }
  return true;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nextNumber(prefix,list){
  const nums=(list||[]).map(x=>parseInt(String(x.numero||'').replace(prefix,''),10)).filter(n=>!isNaN(n));
  const max=nums.length?Math.max(...nums):0;
  return prefix+String(max+1);
}

  });
}

/* ---- crypto: hashing de senha local (PBKDF2-SHA256) ---- */
function genSalt(){ const a=crypto.getRandomValues(new Uint8Array(16)); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function hashPassword(password,saltHex){
  const enc=new TextEncoder();
  const saltBytes=new Uint8Array(saltHex.match(/.{2}/g).map(h=>parseInt(h,16)));
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:saltBytes,iterations:120000,hash:'SHA-256'},keyMaterial,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verifyPassword(password,saltHex,hashHex){
  const h=await hashPassword(password,saltHex);
  return h===hashHex;
}

function getDeviceId(){

function detectDeviceType(){
  const ua=navigator.userAgent||'';
  if(/Android/i.test(ua)) return {tipo:'Celular/Tablet',so:'Android'};
  if(/iPhone|iPad|iPod/i.test(ua)) return {tipo:'Celular/Tablet',so:'iOS'};
  if(/Windows/i.test(ua)) return {tipo:'Computador',so:'Windows'};
  if(/Mac OS/i.test(ua)) return {tipo:'Computador',so:'macOS'};
  if(/Linux/i.test(ua)) return {tipo:'Computador',so:'Linux'};
  return {tipo:'Computador',so:'Desconhecido'};
}

/* ---- download helper (Artifact "downloads" capability, com fallback) ---- */
async function saveFile(filename,content,mime){
  try{
    if(window.claude && window.claude.use){
      const downloads=await window.claude.use('downloads');
      if(downloads){
        const blob=new Blob([content],{type:mime||'application/octet-stream'});
        await downloads.save({filename,data:blob});
        return true;
      }
    }
  }catch(e){
    if(e && e.code==='declined'){ toast('Download cancelado.','info'); return false; }
    console.warn('downloads capability indisponível, usando alternativa:',e);
  }
  try{
    const blob=new Blob([content],{type:mime||'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    return true;
  }catch(e2){ toast('Não foi possível salvar o arquivo neste ambiente.','error'); return false; }
}
function readFileAsText(file){

}
function readFileAsDataURL(file){

function csvFromRows(headers,rows){
  const esc2=(v)=>{ v=(v==null?'':String(v)); if(/[",\n;]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; };
  const lines=[headers.map(esc2).join(';')];
  rows.forEach(r=>lines.push(r.map(esc2).join(';')));
  return '\uFEFF'+lines.join('\n');
}

async function doLogin(email,senha){
  const usuarios=await idbAll('usuarios');
  const user=usuarios.find(u=>u.email.toLowerCase()===String(email).toLowerCase().trim());
  if(!user) return {ok:false,msg:'E-mail não encontrado.'};
  if(user.status==='bloqueado') return {ok:false,msg:'Este usuário está bloqueado. Fale com o administrador da loja.'};
  const valid=await verifyPassword(senha,user.salt,user.senha_hash);
  if(!valid) return {ok:false,msg:'Senha incorreta.'};
  STATE.user=user; STATE.loja=await getLoja();
  lsSet('leuname_session',user.id);
  user.ultimo_login=nowISO();
  await idbPut('usuarios',user);
  await logAction('login','Login realizado');
  await registerCurrentDevice();
  return {ok:true};
}
async function tryRestoreSession(){
  const uidSaved=lsGet('leuname_session');
  if(!uidSaved) return false;
  const user=await idbGet('usuarios',uidSaved);
  if(!user || user.status==='bloqueado') return false;
  STATE.user=user; STATE.loja=await getLoja();
  return true;
}
async function doLogout(){
  await logAction('logout','Logout realizado');
  lsRemove('leuname_session');
  STATE.user=null; STATE.view='dashboard';
  document.getElementById('app-root').classList.remove('ready');
  __booted=false;
  boot();
}
async function registerCurrentDevice(){
  const devId=getDeviceId();
  const info=detectDeviceType();
  let devices=await idbAll('dispositivos');
  let dev=devices.find(d=>d.device_key===devId);
  if(!dev){
    dev={id:uid(),device_key:devId,nome:info.tipo+' ('+info.so+')',tipo:info.tipo,so:info.so,autorizado:true,criado_em:nowISO(),ultimo_acesso:nowISO(),usuario_id:STATE.user?STATE.user.id:null};
    await idbPut('dispositivos',dev);
  }else{
    dev.ultimo_acesso=nowISO(); dev.usuario_id=STATE.user?STATE.user.id:dev.usuario_id;
    await idbPut('dispositivos',dev);
  }
  return dev;
}

/* Compra pela loja LeuApps (www.leunamesoftware.com.br): a licença fica na conta (e-mail + senha)
   do cliente. Entrou na conta -> o app busca a chave dela sozinho. Chave antiga continua valendo. */
const LOJA_COMPRA='/loja/comprar?app=gestacell';
// Chave que veio de plano com prazo (mensal, anual ou teste grátis): o app confere a conta de novo ao abrir.
const CONTA_EXPIRA_LS_KEY='leuname_conta_expira_em';
const DA_CONTA_LS_KEY='leuname_da_conta'; // '1' = o acesso veio da conta da loja (confere a conta ao abrir)
let __testesConta={}, __motivoConta=null;
// Trava de aparelhos: cada conta usa 1 celular + 1 computador. Entrou em outro, este é desconectado.
const MSG_OUTRO_APARELHO='Sua conta entrou em outro aparelho e este foi desconectado (cada conta usa 1 celular e 1 computador). Entre de novo para usar aqui: o outro será desconectado.';
async function gerarChaveTeste(){
  const letras='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const g2=Array.from(crypto.getRandomValues(new Uint8Array(4)),(b)=>letras[b%letras.length]).join('');
  return 'LEU-TRIA-'+g2+'-'+(await licenseChecksum('TRIA',g2));
}
/* Lê o acesso da conta: true = liberado, false = a conta não tem o Gestacell, null = sem internet/servidor. */
async function chaveDaConta(){
  try{
    const r=await fetch('/loja-api/conta/apps',{cache:'no-store',credentials:'same-origin'});
    if(!r.ok) return null;
    const d=await r.json(); __testesConta=d?.testes||{}; __motivoConta=d?.motivo||null;
    const g=d?.apps?.gestacell;
    if(g?.chave && await licenseKeyValid(g.chave)){
      lsSet(LICENSE_LS_KEY,g.chave); lsSet(LICENSE_REVOKED_LS_KEY,''); lsSet(CONTA_EXPIRA_LS_KEY,g.expiraEm||''); lsSet(DA_CONTA_LS_KEY,'1'); return true;
    }
    if(g?.teste){
      let k=lsGet(LICENSE_LS_KEY);
      if(!isTrialKey(k)||!(await licenseKeyValid(k))) k=await gerarChaveTeste();
      lsSet(LICENSE_LS_KEY,k); lsSet(LICENSE_REVOKED_LS_KEY,'');
      lsSet(TRIAL_INICIO_LS_KEY,String(new Date(g.expiraEm).getTime()-TRIAL_DIAS*86400000)); lsSet(CONTA_EXPIRA_LS_KEY,g.expiraEm); lsSet(DA_CONTA_LS_KEY,'1'); return true;
    }
    return false;
  }catch(e){ return null; }
}
/* Confere na conta (com internet) se ainda vale: plano com prazo e também o pagamento único (trava de aparelhos).
   Sem internet: o pagamento único continua; mensal, anual ou teste valem até a data guardada (+1 dia). */
async function acessoDaContaValendo(){
  const expira=lsGet(CONTA_EXPIRA_LS_KEY);
  if(!expira && lsGet(DA_CONTA_LS_KEY)!=='1') return true; // chave antiga, sem conta
  const ok=await chaveDaConta();
  if(ok!==null) return ok;
  if(!expira) return true;
  return Date.now() < new Date(expira).getTime()+86400000;
}
/* Entra na conta da loja; se não der e for o e-mail do dono, tenta a senha da Área do Dono. */
async function entrarNaConta(email,senha){
  const tentar=(rota)=>fetch(rota,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
  let r=await tentar('/loja-api/conta/entrar');
  if(!r.ok && r.status!==429) r=await tentar('/loja-api/dono/entrar');
  if(!r.ok) throw new Error(r.status===429?'Muitas tentativas. Espere um minuto.':'E-mail ou senha não conferem.');
}
async function criarConta(nome,email,senha){
  const r=await fetch('/loja-api/conta/criar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,senha})});
  if(r.ok) return;
  const c=(await r.json().catch(()=>({}))).erro;
  throw new Error(r.status===429?'Muitas tentativas. Espere um minuto.':c==='senha_incorreta'?'Este e-mail já tem conta. Toque em "Já tenho conta" e entre.':'Não deu para criar a conta. Confira os dados.');
}
/* Começa (ou retoma) o teste grátis da conta logada. 'sem_conta' = precisa entrar ou criar a conta. */
async function comecarTesteGratis(){
  const r=await fetch('/loja-api/conta/teste',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:'gestacell'})});
  if(r.status===401) return 'sem_conta';
  const d=await r.json().catch(()=>({}));
  if(d.erro==='teste_acabou'){ __testesConta.gestacell=d; return 'acabou'; }
  if(!r.ok) throw new Error('Não deu para começar o teste agora. Tente de novo.');
  return (await chaveDaConta())?'ok':'erro';
}

  const depoisDaConta=async(querTeste)=>{

/* Dono da loja esqueceu a senha do Gestacell: prova que é o dono entrando na conta em que
   comprou (ou com a senha de dono da LeuName) e, se a licença for a mesma deste aparelho,
   cria uma senha nova para um administrador. Os dados da loja continuam todos. */
async function renderRecuperarSenha(){
  document.getElementById('app-root').classList.remove('ready');
  const loja=await getLoja();
  const admins=(await idbAll('usuarios')).filter(u=>u.papel==='administrador');
  const root=document.getElementById('auth-root');
  root.innerHTML=`
  <div class="auth-screen"><div class="auth-card">
    ${authBrandHTML(loja)}
    <h2 style="font-size:17px;text-align:center;margin-bottom:2px;">Criar senha nova</h2>
    <p class="muted small center" style="margin-bottom:16px;">Para provar que a loja é sua, entre com o <b>e-mail e a senha da conta em que comprou o Gestacell</b>.</p>
    <div class="field"><label>E-mail da compra</label><input type="email" id="rs-email" autocomplete="username" placeholder="voce@email.com"></div>
    <div class="field" style="margin-top:10px;"><label>Senha da conta</label><input type="password" id="rs-senha" autocomplete="current-password"></div>
    <div class="divider" style="margin:16px 0 12px;"></div>
    <div class="field"><label>Administrador</label><select id="rs-admin">${admins.map(u=>`<option value="${esc(u.id)}">${esc(u.nome)} · ${esc(u.email)}</option>`).join('')}</select></div>
    <div class="form-grid" style="margin-top:10px;">
      <div class="field"><label>Senha nova do Gestacell</label><input type="password" id="rs-nova" autocomplete="new-password" placeholder="mín. 6 caracteres"></div>
      <div class="field"><label>Repita a senha nova</label><input type="password" id="rs-nova2" autocomplete="new-password"></div>
    </div>
    <div id="rs-erro" class="callout warn hidden" style="margin-top:12px;"></div>
    <button class="btn primary" id="rs-ok" style="width:100%;justify-content:center;margin-top:14px;padding:11px;">Salvar senha nova e entrar</button>
    <p class="small center" style="margin-top:12px;"><a href="#" id="rs-voltar">Voltar</a></p>
    ${authFooterHTML()}
  </div></div>`;
  document.getElementById('rs-voltar').onclick=(e)=>{ e.preventDefault(); renderLogin(); };
  const erro=(t)=>{ const b=document.getElementById('rs-erro'); b.textContent=t; b.classList.remove('hidden'); };
  document.getElementById('rs-ok').onclick=async()=>{
    const email=document.getElementById('rs-email').value.trim(), senha=document.getElementById('rs-senha').value;
    const nova=document.getElementById('rs-nova').value, nova2=document.getElementById('rs-nova2').value;
    const user=admins.find(u=>u.id===document.getElementById('rs-admin').value);
    if(!email||!senha) return erro('Digite o e-mail e a senha da conta em que comprou.');
    if(!user) return erro('Nenhum administrador neste aparelho.');
    if(nova.length<6) return erro('A senha nova precisa ter pelo menos 6 caracteres.');
    if(nova!==nova2) return erro('As duas senhas novas não são iguais.');
    const btn=document.getElementById('rs-ok'); btn.disabled=true; btn.textContent='Conferindo...';
    try{
      await entrarNaConta(email,senha);
      const r=await fetch('/loja-api/conta/apps',{cache:'no-store',credentials:'same-origin'});
      const chave=r.ok?(await r.json())?.apps?.gestacell?.chave:null;
      if(!chave||chave!==lsGet(LICENSE_LS_KEY)) throw new Error('Esta conta não é a dona do Gestacell deste aparelho.');
      user.salt=genSalt(); user.senha_hash=await hashPassword(nova,user.salt); user.status='ativo';
      await idbPut('usuarios',user);
      const l=await doLogin(user.email,nova);
      if(!l.ok) throw new Error(l.msg);
      await logAction('senha_recuperada','Senha do administrador trocada pela conta da compra');
      toast('Senha nova salva!','success');
      startApp();
    }catch(e){ erro(navigator.onLine?e.message:'Sem internet. Conecte-se e tente de novo.'); btn.disabled=false; btn.textContent='Salvar senha nova e entrar'; }
  };
}

        <button class="btn outline" id="ob-back3">Voltar</button>
        <button class="btn primary" id="ob-next3">Continuar</button>

  } else if(OB.step===4){
    body=`
      <h3 style="font-size:15.5px;margin-bottom:14px;">3. Licença</h3>
      <div class="callout info"><span>${ic('key',16)}</span><span>Licença ativada: <b>${esc(d.licenca||lsGet(LICENSE_LS_KEY)||'')}</b>. Você pode gerenciá-la depois em Configurações → Licença. Até ${LICENSE_MAX_DEVICES_DEFAULT} dispositivos por licença.</span></div>
      <div class="field" style="margin-top:14px;"><label>Armazenamento em nuvem</label>
        <div class="callout info"><span>${ic('cloud',16)}</span><span>Você poderá conectar Google Drive, OneDrive ou Dropbox a qualquer momento em Configurações → Backup e Sincronização. Por enquanto o sistema funciona 100% offline no seu dispositivo.</span></div>

function wireOnboardingStep(){
  const d=OB.data;
  if(OB.step===1){
    document.getElementById('ob-start').onclick=()=>{ OB.step=2; renderOnboarding(); };
  } else if(OB.step===2){
    document.getElementById('ob-back').onclick=()=>{ OB.step=1; renderOnboarding(); };
    document.getElementById('ob-next2').onclick=()=>{
      d.resp_nome=document.getElementById('ob-nome').value.trim();
      d.resp_email=document.getElementById('ob-email').value.trim();
      d.resp_senha=document.getElementById('ob-senha').value;
      d.resp_senha2=document.getElementById('ob-senha2').value;
      const err=document.getElementById('ob-err2');
      if(!d.resp_nome||!d.resp_email||!d.resp_senha){ err.textContent='Preencha todos os campos obrigatórios.'; err.classList.remove('hidden'); return; }
      if(d.resp_senha.length<6){ err.textContent='A senha deve ter ao menos 6 caracteres.'; err.classList.remove('hidden'); return; }
      if(d.resp_senha!==d.resp_senha2){ err.textContent='As senhas não coincidem.'; err.classList.remove('hidden'); return; }
      if(!/^\S+@\S+\.\S+$/.test(d.resp_email)){ err.textContent='Informe um e-mail válido.'; err.classList.remove('hidden'); return; }
      OB.step=3; renderOnboarding();
    };
  } else if(OB.step===3){
    document.getElementById('ob-back3').onclick=()=>{ OB.step=2; renderOnboarding(); };
    document.getElementById('ob-logo-drop').onclick=(e)=>{};
    document.getElementById('ob-logo-input').addEventListener('change',async(e)=>{
      const f=e.target.files[0]; if(!f) return;
      d.loja_nome=document.getElementById('ob-loja-nome').value;
      d.loja_cnpj=document.getElementById('ob-loja-cnpj').value;
      d.loja_tel=document.getElementById('ob-loja-tel').value;
      d.loja_whats=document.getElementById('ob-loja-whats').value;
      d.loja_end=document.getElementById('ob-loja-end').value;
      d.logo=await readFileAsDataURL(f); renderOnboarding();
    });
    document.getElementById('ob-next3').onclick=()=>{
      d.loja_nome=document.getElementById('ob-loja-nome').value.trim();
      d.loja_cnpj=document.getElementById('ob-loja-cnpj').value.trim();
      d.loja_tel=document.getElementById('ob-loja-tel').value.trim();
      d.loja_whats=document.getElementById('ob-loja-whats').value.trim();
      d.loja_end=document.getElementById('ob-loja-end').value.trim();
      if(!d.loja_nome){ toast('Informe o nome da loja.','error'); return; }
      OB.step=4; renderOnboarding();
    };
  } else if(OB.step===4){
    document.getElementById('ob-back4').onclick=()=>{ OB.step=3; renderOnboarding(); };
    document.getElementById('ob-finish').onclick=async()=>{
      d.licenca=lsGet(LICENSE_LS_KEY)||'';
      await finishOnboarding();
    };
  }
}

async function finishOnboarding(){
  const d=OB.data;
  const loja={id:uid(),nome:d.loja_nome,cnpj:d.loja_cnpj,telefone:d.loja_tel,whatsapp:d.loja_whats,endereco:d.loja_end,logo:d.logo||null,email:'',criado_em:nowISO(),moeda:'BRL'};
  await idbPut('loja',loja);
  const salt=genSalt();
  const hash=await hashPassword(d.resp_senha,salt);
  const admin={id:uid(),nome:d.resp_nome,email:d.resp_email,salt,senha_hash:hash,papel:'administrador',status:'ativo',permissoes:ROLE_DEFAULT_PERMS.administrador,criado_em:nowISO(),ultimo_login:null};
  await idbPut('usuarios',admin);
  await idbPut('config',{id:'geral',impressao:{cabecalho:true,rodape:'Gestacell — sistema desenvolvido pela LeuName Softwares'},backup:{frequencia:'diaria',auto:true,ultimo_backup:null},nuvem:{provedor:null,conectado:false,conta:null},licenca:{chave:d.licenca||null,status:d.licenca?'ativada_local':'avaliacao',dispositivosMax:LICENSE_MAX_DEVICES_DEFAULT,ativada_em:d.licenca?nowISO():null}});
  STATE.loja=loja; STATE.user=admin;
  lsSet('leuname_session',admin.id);
  await logAction('loja_criada','Loja "'+loja.nome+'" criada no primeiro acesso');
  await logAction('usuario_criado','Administrador "'+admin.nome+'" criado');
  await registerCurrentDevice();
  toast('Loja criada com sucesso! Bem-vindo ao Gestacell.','success');
  startApp();
}

function fieldHTML(f,val){
  const v = val==null?'':val;
  const spanCls = f.span===2?'span2':(f.span===3?'span3':'');
  let inner='';
  if(f.type==='select'){
    const opts = typeof f.options==='function' ? f.options() : (f.options||[]);
    inner=`<select id="fld-${f.name}">${opts.map(o=>{
      const ov=typeof o==='object'?o.value:o; const ol=typeof o==='object'?o.label:o;
      return `<option value="${esc(ov)}" ${String(v)===String(ov)?'selected':''}>${esc(ol)}</option>`;
    }).join('')}</select>`;
  } else if(f.type==='textarea'){
    inner=`<textarea id="fld-${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
  } else if(f.type==='file'){
    inner=`<label class="logo-drop" id="fld-${f.name}-drop">${v?('<img src="'+v+'">'):ic('produtos',22)}<div>${v?'Clique para trocar a foto':'Clique para enviar foto (opcional)'}</div><input type="file" id="fld-${f.name}" accept="image/*" style="display:none"></label>`;
  } else if(f.type==='check'){
    return `<div class="field ${spanCls} check"><input type="checkbox" id="fld-${f.name}" ${v?'checked':''}><label style="margin:0;">${f.label}</label></div>`;
  } else {
    inner=`<input type="${f.type||'text'}" id="fld-${f.name}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.step?('step="'+f.step+'"'):''}>`;
  }
  return `<div class="field ${spanCls}"><label>${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>${inner}${f.help?'<small class="hint">'+esc(f.help)+'</small>':''}</div>`;
}
function wireFileFields(fields,item){
  fields.filter(f=>f.type==='file').forEach(f=>{
    const input=document.getElementById('fld-'+f.name);
    if(!input) return;
    input.addEventListener('change',async(e)=>{
      const file=e.target.files[0]; if(!file) return;
      const dataUrl=await readFileAsDataURL(file);
      item.__pendingFiles=item.__pendingFiles||{}; item.__pendingFiles[f.name]=dataUrl;
      const drop=document.getElementById('fld-'+f.name+'-drop');
      drop.innerHTML=`<img src="${dataUrl}"><div>Clique para trocar a foto</div><input type="file" id="fld-${f.name}" accept="image/*" style="display:none">`;
      wireFileFields(fields,item);
    });
  });
}
function readFieldValues(fields,item){
  const out={};
  fields.forEach(f=>{
    if(f.type==='file'){ out[f.name]=(item.__pendingFiles&&item.__pendingFiles[f.name])||item[f.name]||null; return; }
    const el=document.getElementById('fld-'+f.name);
    if(!el) return;
    if(f.type==='check'){ out[f.name]=el.checked; }
    else if(f.type==='number'){ out[f.name]=el.value===''?0:parseFloat(el.value); }
    else{ out[f.name]=el.value; }
  });
  return out;
}

function makeCrud(opts){
  async function openForm(item){
    item=item?Object.assign({},item):Object.assign({id:uid()},opts.onNew?opts.onNew():{});
    const isEdit=!!(item.criado_em);
    openModal(`
      <div class="modal-head"><h3>${isEdit?'Editar':'Novo'} ${esc(opts.singular)}</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
      <div class="modal-body"><div class="form-grid">${opts.fields.map(f=>fieldHTML(f,item[f.name])).join('')}</div></div>
      <div class="modal-foot"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" id="crud-save">${ic('check',15)} Salvar</button></div>`,{wide:opts.wideForm});
    wireFileFields(opts.fields,item);
    document.getElementById('crud-save').onclick=async()=>{
      const vals=readFieldValues(opts.fields,item);
      for(const f of opts.fields){ if(f.required && !vals[f.name] && vals[f.name]!==0){ toast('Preencha o campo "'+f.label+'".','error'); return; } }
      const rec=Object.assign({},item,vals);
      delete rec.__pendingFiles;
      if(!isEdit) rec.criado_em=nowISO();
      rec.atualizado_em=nowISO();
      if(opts.beforeSave) await opts.beforeSave(rec,isEdit);
      await idbPut(opts.store,rec);
      await logAction((isEdit?'edicao_':'criacao_')+opts.store, esc(rec.nome||rec.numero||rec.id));
      if(opts.afterSave) await opts.afterSave(rec,isEdit);

          <tbody>${filtered.map(it=>`<tr>${opts.columns.map(c=>'<td>'+(c.render?c.render(it):esc(it[c.key]||'—'))+'</td>').join('')}
            <td class="right"><div class="btn-row" style="justify-content:flex-end;">
              ${opts.rowActionsExtra?opts.rowActionsExtra(it):''}
              <button class="btn ghost sm" data-crud-edit="${it.id}">${ic('edit',14)}</button>
              <button class="btn ghost sm" data-crud-del="${it.id}" style="color:var(--red)">${ic('trash',14)}</button>
            </div></td></tr>`).join('')}</tbody></table>`
          : `<div class="empty-state">${ic(opts.icon,34)}<h4>Nenhum ${opts.singular.toLowerCase()} encontrado</h4><p>Clique em "Novo ${opts.singular}" para começar a cadastrar.</p></div>`}

  function wireView(){
    const content=document.getElementById('content');
    const search=document.getElementById('crud-search');
    if(search){ search.addEventListener('input',()=>{ STATE.cache[opts.store+'_q']=search.value; render(); }); }
    const newBtn=content.querySelector('[data-crud-act="new"]'); if(newBtn) newBtn.onclick=()=>openForm(null);
    const lowBtn=content.querySelector('[data-crud-act="filter-low"]'); if(lowBtn) lowBtn.onclick=async()=>{
      const items=await idbAll(opts.store); const low=items.filter(it=>Number(it.quantidade)<=Number(it.estoque_minimo||0));
      openModal(`<div class="modal-head"><h3>Estoque baixo — ${esc(opts.title)}</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
      <div class="modal-body">${low.length?low.map(it=>`<div class="list-row"><div class="list-ic">${ic(opts.icon,16)}</div><div class="list-main"><b>${esc(it.nome)}</b><small>Qtd: ${it.quantidade} · Mínimo: ${it.estoque_minimo||0}</small></div><span class="chip amber">baixo</span></div>`).join(''):'<p class="muted">Nenhum item com estoque baixo.</p>'}</div>`);
    };
    const expBtn=content.querySelector('[data-crud-act="export"]'); if(expBtn) expBtn.onclick=async()=>{
      const items=await idbAll(opts.store);
      const headers=opts.columns.map(c=>c.label);

      await saveFile(opts.store+'-'+todayStr()+'.csv',csvFromRows(headers,rows),'text/csv');

    };

    content.querySelectorAll('[data-crud-del]').forEach(b=>b.onclick=()=>del(b.dataset.crudDel));
    if(opts.wireExtra) opts.wireExtra(content);
  }
  return {render:renderView, wire:wireView, openForm, del};
}

async function openStockMoveModal(store,itemId){
  const item=await idbGet(store,itemId);
  if(!item) return;
  openModal(`
    <div class="modal-head"><h3>Movimentar estoque — ${esc(item.nome)}</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
    <div class="modal-body">
      <p class="muted small">Quantidade atual: <b>${item.quantidade}</b></p>
      <div class="form-grid" style="margin-top:10px;">
        <div class="field"><label>Tipo de movimentação</label>
          <select id="mv-tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option><option value="ajuste">Ajuste (definir quantidade)</option></select>
        </div>
        <div class="field"><label>Quantidade</label><input type="number" id="mv-qtd" min="0" value="1"></div>
        <div class="field span2"><label>Observação</label><input type="text" id="mv-obs" placeholder="Motivo da movimentação (opcional)"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" id="mv-save">Confirmar</button></div>`);
  document.getElementById('mv-save').onclick=async()=>{
    const tipo=document.getElementById('mv-tipo').value;
    const qtd=parseFloat(document.getElementById('mv-qtd').value||'0');
    const obs=document.getElementById('mv-obs').value;
    let novaQtd=Number(item.quantidade||0);
    if(tipo==='entrada') novaQtd+=qtd; else if(tipo==='saida') novaQtd=Math.max(0,novaQtd-qtd); else novaQtd=qtd;
    item.quantidade=novaQtd;
    await idbPut(store,item);
    await logAction('movimentacao_estoque_'+store,`${item.nome}: ${tipo} ${qtd} (obs: ${obs||'-'}) → novo saldo ${novaQtd}`);
    closeModal(); toast('Estoque atualizado.','success'); render();
  };
}

function last7Days(){ const out=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(d.toISOString().slice(0,10)); } return out; }

function sparklineSVG(points,w,h){
  w=w||620; h=h||200;
  const max=Math.max(1,...points.map(p=>p.v));
  const min=0;
  const pad=34; // margem nas pontas: a data e o valor do primeiro e do último dia não ficam cortados
  const stepX=(w-2*pad)/Math.max(1,points.length-1);
  const coords=points.map((p,i)=>{ const x=pad+i*stepX; const y=h-18-((p.v-min)/(max-min||1))*(h-46); return [x,y]; });
  const path='M'+coords.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' L');
  const area=path+` L${pad+(coords.length-1)*stepX},${h-18} L${pad},${h-18} Z`;
  const dots=coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.4" fill="#1E6FD9"/>`).join('');
  const labels=points.map((p,i)=>`<text x="${coords[i][0].toFixed(1)}" y="${h-2}" font-size="10.5" fill="#9AA7B8" text-anchor="middle" font-family="Inter,sans-serif">${p.label}</text>`).join('');
  const lastV=points[points.length-1]?points[points.length-1].v:0;
  const lastX=coords[coords.length-1]?coords[coords.length-1][0]:0, lastY=coords[coords.length-1]?coords[coords.length-1][1]:0;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="dashGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1E6FD9" stop-opacity="0.22"/><stop offset="100%" stop-color="#1E6FD9" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#dashGrad)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#1E6FD9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
    <text x="${lastX}" y="${Math.max(12,lastY-10)}" font-size="11" font-weight="700" fill="#0B2545" text-anchor="middle" font-family="Inter,sans-serif">${fmtBRL(lastV)}</text>
  </svg>`;
}

async function openNovaVenda(){
  CART=[];
  const [produtos,clientes,usuarios]=await Promise.all([idbAll('produtos'),idbAll('clientes'),idbAll('usuarios')]);

}
function renderVendaModal(){
  const produtos=STATE.cache.vendaProdutos, clientes=STATE.cache.vendaClientes, usuarios=STATE.cache.vendaUsuarios;
  const subtotal=CART.reduce((s,i)=>s+i.preco*i.quantidade,0);
  const custoTotal=CART.reduce((s,i)=>s+i.custo*i.quantidade,0);
  openModal(`
    <div class="modal-head"><h3>Nova Venda</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Cliente</label><select id="vd-cliente"><option value="">Consumidor final</option>${clientes.map(c=>`<option value="${c.id}">${clienteClassEmoji(c.classificacao)}${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="field"><label>Vendedor</label><select id="vd-vendedor">${usuarios.map(u=>`<option value="${u.id}" ${u.id===STATE.user.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></div>
      </div>
      <div class="divider"></div>
      <div class="form-grid c3">
        <div class="field span2"><label>Produto</label><select id="vd-produto">${produtos.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${fmtBRL(p.preco)} (est.: ${p.quantidade})</option>`).join('')}</select></div>
        <div class="field"><label>Quantidade</label><input type="number" id="vd-qtd" value="1" min="1"></div>
      </div>
      <button class="btn outline" id="vd-add" style="margin-bottom:12px;">${ic('plus',14)} Adicionar item</button>
      <div class="table-wrap panel" style="margin-bottom:12px;"><table><thead><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead>
        <tbody id="vd-cart-body">${CART.length?CART.map((it,idx)=>`<tr><td>${esc(it.nome)}</td><td>${it.quantidade}</td><td>${fmtBRL(it.preco)}</td><td>${fmtBRL(it.preco*it.quantidade)}</td><td><button class="btn ghost sm" data-rm="${idx}">${ic('trash',13)}</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted center" style="padding:16px;">Nenhum item adicionado</td></tr>'}</tbody>
      </table></div>
      <div class="form-grid">
        <div class="field"><label>Forma de pagamento</label><select id="vd-pagamento">${PAY_METHODS.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="field"><label>Desconto (R$)</label><input type="number" id="vd-desconto" value="0" step="0.01" min="0"></div>
      </div>
      <div class="panel" style="padding:12px 14px;margin-top:6px;background:var(--blue-lighter);border:none;">
        <div class="flex-between"><span class="small">Subtotal</span><b>${fmtBRL(subtotal)}</b></div>
        <div class="flex-between"><span class="small">Custo total</span><span class="small">${fmtBRL(custoTotal)}</span></div>
        <div class="flex-between" style="margin-top:6px;"><span style="font-weight:700;">Total</span><b id="vd-total-display" style="font-size:16px;">${fmtBRL(subtotal)}</b></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" id="vd-finalizar">${ic('check',15)} Finalizar Venda</button></div>
  `,{wide:true,persistent:true});
  document.getElementById('vd-add').onclick=()=>{
    const pid=document.getElementById('vd-produto').value;
    const qtd=parseFloat(document.getElementById('vd-qtd').value||'1');
    const p=produtos.find(x=>x.id===pid); if(!p) return;
    if(qtd<=0){ toast('Quantidade inválida.','error'); return; }
    const jaNoCarrinho=CART.filter(c=>c.produto_id===pid).reduce((s,c)=>s+c.quantidade,0);
    if(jaNoCarrinho+qtd>Number(p.quantidade)){ toast('Estoque insuficiente para "'+p.nome+'". Disponível: '+p.quantidade,'error'); return; }
    const existing=CART.find(c=>c.produto_id===pid);
    if(existing) existing.quantidade+=qtd; else CART.push({produto_id:pid,nome:p.nome,preco:Number(p.preco),custo:Number(p.custo||0),quantidade:qtd});
    renderVendaModal();
  };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ CART.splice(parseInt(b.dataset.rm),1); renderVendaModal(); });
  const descInput=document.getElementById('vd-desconto');
  descInput.addEventListener('input',()=>{ const desc=parseFloat(descInput.value||'0'); document.getElementById('vd-total-display').textContent=fmtBRL(Math.max(0,subtotal-desc)); });
  document.getElementById('vd-finalizar').onclick=finalizarVenda;
}
async function finalizarVenda(){
  if(!CART.length){ toast('Adicione ao menos um item à venda.','error'); return; }
  const clienteId=document.getElementById('vd-cliente').value||null;
  const vendedorId=document.getElementById('vd-vendedor').value;
  const pagamento=document.getElementById('vd-pagamento').value;
  const desconto=parseFloat(document.getElementById('vd-desconto').value||'0');
  const subtotal=CART.reduce((s,i)=>s+i.preco*i.quantidade,0);
  const custoTotal=CART.reduce((s,i)=>s+i.custo*i.quantidade,0);
  const total=Math.max(0,subtotal-desconto);
  const lucro=total-custoTotal;
  const vendas=await idbAll('vendas');
  const venda={id:uid(),numero:nextNumber('',vendas),data:nowISO(),cliente_id:clienteId,vendedor_id:vendedorId,itens:CART.map(c=>({produto_id:c.produto_id,nome:c.nome,quantidade:c.quantidade,preco:c.preco,custo:c.custo})),forma_pagamento:pagamento,desconto,subtotal,total,custo_total:custoTotal,lucro};
  await idbPut('vendas',venda);
  for(const item of CART){
    const p=await idbGet('produtos',item.produto_id);
    if(p){ p.quantidade=Math.max(0,Number(p.quantidade)-item.quantidade); await idbPut('produtos',p); }
  }
  await idbPut('financeiro',{id:uid(),tipo:'receita',categoria:'Venda',descricao:'Venda Nº '+venda.numero,valor:total,data:venda.data,status:'pago',venda_id:venda.id,forma_pagamento:pagamento});
  await logAction('venda_criada','Venda Nº '+venda.numero+' — '+fmtBRL(total));
  closeModal();
  toast('Venda Nº '+venda.numero+' finalizada com sucesso!','success');
  CART=[];
  render();
  setTimeout(()=>printVenda(venda.id),300);
}

async function excluirVenda(id){
  const v=await idbGet('vendas',id);
  if(!v) return;
  const ok=await confirmDialog('Excluir venda','Tem certeza que deseja excluir a venda Nº '+esc(v.numero)+'? O estoque dos produtos será devolvido e o lançamento financeiro correspondente será removido. Esta ação não pode ser desfeita.',{danger:true,okLabel:'Excluir venda'});
  if(!ok) return;
  for(const item of (v.itens||[])){
    const p=await idbGet('produtos',item.produto_id);
    if(p){ p.quantidade=Number(p.quantidade||0)+Number(item.quantidade||0); await idbPut('produtos',p); }
  }
  const financeiro=await idbAll('financeiro');
  for(const f of financeiro){ if(f.venda_id===id) await idbDelete('financeiro',f.id); }
  await idbDelete('vendas',id);
  await logAction('exclusao_venda','Venda Nº '+v.numero+' excluída — estoque devolvido');
  toast('Venda excluída e estoque devolvido.','success');
  render();
}

async function recalcOSTotal(os){
  os.valor_total = Math.max(0, Number(os.valor_pecas||0)+Number(os.mao_de_obra||0)-Number(os.desconto||0));
  return os;
}

async function openAddPecaToOS(os){
  const pecas=await idbAll('pecas');
  openModal(`
    <div class="modal-head"><h3>Adicionar peça à OS Nº ${esc(os.numero)}</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
    <div class="modal-body">
      <div class="form-grid c3">
        <div class="field span2"><label>Peça</label><select id="pu-peca">${pecas.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${fmtBRL(p.preco)} (est.: ${p.quantidade})</option>`).join('')}</select></div>
        <div class="field"><label>Quantidade</label><input type="number" id="pu-qtd" value="1" min="1"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" id="pu-add">Adicionar</button></div>`);
  document.getElementById('pu-add').onclick=async()=>{
    const pecaId=document.getElementById('pu-peca').value;
    const qtd=parseFloat(document.getElementById('pu-qtd').value||'1');
    const peca=pecas.find(p=>p.id===pecaId);
    if(!peca) return;
    if(qtd>Number(peca.quantidade)){ toast('Estoque de peças insuficiente. Disponível: '+peca.quantidade,'error'); return; }
    os.pecas_utilizadas.push({peca_id:pecaId,nome:peca.nome,quantidade:qtd,preco:Number(peca.preco)});
    os.valor_pecas=os.pecas_utilizadas.reduce((s,pu)=>s+pu.preco*pu.quantidade,0);
    await recalcOSTotal(os);
    peca.quantidade=Number(peca.quantidade)-qtd;
    await idbPut('pecas',peca);
    await idbPut('ordens',os);
    await logAction('peca_usada_os','OS Nº '+os.numero+': '+peca.nome+' x'+qtd);
    closeModal(); toast('Peça adicionada à OS.','success');
    openOSDetail(os.id);
  };
}

async function openRegistrarEntrega(os){
  openModal(`
    <div class="modal-head"><h3>Registrar entrega — OS Nº ${esc(os.numero)}</h3><button class="x-btn" onclick="closeModal()">${ic('x',15)}</button></div>
    <div class="modal-body">
      <div class="callout info"><span>${ic('check',15)}</span><span>Total da OS: <b>${fmtBRL(os.valor_total)}</b></span></div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="field"><label>Forma de pagamento</label><select id="ent-pagamento">${PAY_METHODS.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="field check" style="align-self:end;"><input type="checkbox" id="ent-pago" checked><label style="margin:0;">Pagamento recebido</label></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ent-confirmar">${ic('check',15)} Confirmar entrega</button></div>`);
  document.getElementById('ent-confirmar').onclick=async()=>{
    const pago=document.getElementById('ent-pago').checked;
    const pagamento=document.getElementById('ent-pagamento').value;
    os.status='ENTREGUE'; os.data_entrega=nowISO(); os.pagamento_registrado=pago; os.forma_pagamento=pagamento;
    await idbPut('ordens',os);
    if(pago){
      await idbPut('financeiro',{id:uid(),tipo:'receita',categoria:'Ordem de Serviço',descricao:'OS Nº '+os.numero,valor:os.valor_total,data:nowISO(),status:'pago',os_id:os.id,forma_pagamento:pagamento});
    }
    await logAction('os_entregue','OS Nº '+os.numero+' entregue — '+fmtBRL(os.valor_total));
    closeModal(); toast('Entrega registrada com sucesso.','success'); render();
    setTimeout(()=>printOSSaida(os.id),300);
  };
}

function checklistPrintHTML(checklist,extra){
  checklist=checklist||{};
  const itens=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;min-width:0;">${CHECKLIST_ITENS.map(it=>{
    const on=!!checklist[it.key];
    return `<div style="font-size:9.5px;line-height:1.5;overflow-wrap:break-word;min-width:0;"><span style="display:inline-block;width:9px;height:9px;border:1.2px solid #333;margin-right:4px;text-align:center;line-height:8px;font-size:8px;vertical-align:middle;flex:none;">${on?'✓':''}</span>${esc(it.label)}</div>`;
  }).join('')}</div>`;
  const extraHTML=extra?`<div style="margin-top:4px;font-size:9.5px;overflow-wrap:break-word;"><b>Obs.:</b> ${esc(extra)}</div>`:'';
  return itens+extraHTML;
}
function senhaPrintHTML(os){

async function excluirOS(id){
  const os=await idbGet('ordens',id);
  if(!os) return;
  const ok=await confirmDialog('Excluir Ordem de Serviço','Tem certeza que deseja excluir a OS Nº '+esc(os.numero)+'? As peças usadas serão devolvidas ao estoque e o lançamento financeiro correspondente (se houver) será removido. Esta ação não pode ser desfeita.',{danger:true,okLabel:'Excluir OS'});
  if(!ok) return;
  for(const pu of (os.pecas_utilizadas||[])){
    const p=await idbGet('pecas',pu.peca_id);
    if(p){ p.quantidade=Number(p.quantidade||0)+Number(pu.quantidade||0); await idbPut('pecas',p); }
  }
  const financeiro=await idbAll('financeiro');
  for(const f of financeiro){ if(f.os_id===id) await idbDelete('financeiro',f.id); }
  await idbDelete('ordens',id);
  await logAction('exclusao_os','OS Nº '+os.numero+' excluída — peças devolvidas ao estoque');
  toast('OS excluída e peças devolvidas ao estoque.','success');
  render();
}

function periodoRange(periodo){
  const now=new Date(); let start,end=new Date(now); end.setHours(23,59,59,999);
  if(periodo==='hoje'){ start=new Date(now); start.setHours(0,0,0,0); }
  else if(periodo==='semana'){ start=new Date(now); start.setDate(now.getDate()-7); }
  else if(periodo==='mes'){ start=new Date(now); start.setDate(now.getDate()-30); }
  else { start=new Date(2000,0,1); }
  return {start,end};
}

async function excluirFinanceiro(id){
  const l=await idbGet('financeiro',id);
  if(!l) return;
  const vinculado=l.venda_id?' Este lançamento está vinculado a uma venda — excluí-lo aqui não apaga a venda (para isso, exclua a venda em Vendas).':(l.os_id?' Este lançamento está vinculado a uma OS — excluí-lo aqui não apaga a OS (para isso, exclua a OS em Ordens de Serviço).':'');
  const ok=await confirmDialog('Excluir lançamento','Tem certeza que deseja excluir "'+esc(l.descricao||l.categoria||'')+'"?'+vinculado+' Esta ação não pode ser desfeita.',{danger:true,okLabel:'Excluir'});
  if(!ok) return;
  await idbDelete('financeiro',id);
  await logAction('exclusao_financeiro',l.descricao||l.categoria||id);
  toast('Lançamento excluído.','success');
  render();
}

const REPORT_TABS=[
  {id:'vendas',label:'Vendas'},
  {id:'produtos_vendidos',label:'Produtos mais vendidos'},
  {id:'estoque',label:'Estoque'},
  {id:'estoque_baixo',label:'Estoque baixo'},
  {id:'pecas',label:'Peças'},
  {id:'os',label:'OS por status'},
  {id:'financeiro',label:'Financeiro'},
];
async function buildReportData(tab){
  if(tab==='vendas'){
    const vendas=(await idbAll('vendas')).sort((a,b)=>new Date(b.data)-new Date(a.data));
    return {headers:['Número','Data','Total','Custo','Lucro','Pagamento'],rows:vendas.map(v=>[v.numero,fmtDateTime(v.data),fmtBRL(v.total),fmtBRL(v.custo_total),fmtBRL(v.lucro),v.forma_pagamento]),csvRows:vendas.map(v=>[v.numero,v.data,v.total,v.custo_total,v.lucro,v.forma_pagamento]),ids:vendas.map(v=>v.id),deleteType:'venda'};
  }
  if(tab==='produtos_vendidos'){
    const vendas=await idbAll('vendas'); const map={};
    vendas.forEach(v=>(v.itens||[]).forEach(i=>{ map[i.nome]=map[i.nome]||{qtd:0,total:0}; map[i.nome].qtd+=i.quantidade; map[i.nome].total+=i.preco*i.quantidade; }));
    const rows=Object.entries(map).sort((a,b)=>b[1].qtd-a[1].qtd);
    return {headers:['Produto','Quantidade vendida','Total (R$)'],rows:rows.map(([n,v])=>[n,v.qtd,fmtBRL(v.total)]),csvRows:rows.map(([n,v])=>[n,v.qtd,v.total])};
  }
  if(tab==='estoque'){
    const produtos=await idbAll('produtos');
    return {headers:['Produto','Categoria','Qtd.','Estoque mínimo','Preço','Valor em estoque'],rows:produtos.map(p=>[p.nome,p.categoria||'—',p.quantidade,p.estoque_minimo||0,fmtBRL(p.preco),fmtBRL(p.preco*p.quantidade)]),csvRows:produtos.map(p=>[p.nome,p.categoria,p.quantidade,p.estoque_minimo,p.preco,p.preco*p.quantidade])};
  }
  if(tab==='estoque_baixo'){
    const produtos=(await idbAll('produtos')).filter(p=>Number(p.quantidade)<=Number(p.estoque_minimo||0));
    const pecas=(await idbAll('pecas')).filter(p=>Number(p.quantidade)<=Number(p.estoque_minimo||0));
    const all=[...produtos.map(p=>({...p,__tipo:'Produto'})),...pecas.map(p=>({...p,__tipo:'Peça'}))];
    return {headers:['Tipo','Item','Qtd. atual','Mínimo'],rows:all.map(p=>[p.__tipo,p.nome,p.quantidade,p.estoque_minimo||0]),csvRows:all.map(p=>[p.__tipo,p.nome,p.quantidade,p.estoque_minimo])};
  }
  if(tab==='pecas'){
    const pecas=await idbAll('pecas');
    return {headers:['Peça','Compatibilidade','Qtd.','Preço','Valor em estoque'],rows:pecas.map(p=>[p.nome,p.modelo||'—',p.quantidade,fmtBRL(p.preco),fmtBRL(p.preco*p.quantidade)]),csvRows:pecas.map(p=>[p.nome,p.modelo,p.quantidade,p.preco,p.preco*p.quantidade])};
  }
  if(tab==='os'){
    const ordens=await idbAll('ordens'); const map={};
    OS_STATUS.forEach(s=>map[s]=0); ordens.forEach(o=>map[o.status]=(map[o.status]||0)+1);
    return {headers:['Status','Quantidade'],rows:Object.entries(map).map(([s,c])=>[s,c]),csvRows:Object.entries(map)};
  }
  if(tab==='financeiro'){
    const lanc=(await idbAll('financeiro')).sort((a,b)=>new Date(b.data)-new Date(a.data));
    return {headers:['Data','Descrição','Tipo','Status','Valor'],rows:lanc.map(l=>[fmtDate(l.data),l.descricao,l.tipo,l.status,fmtBRL(l.valor)]),csvRows:lanc.map(l=>[l.data,l.descricao,l.tipo,l.status,l.valor]),ids:lanc.map(l=>l.id),deleteType:'financeiro'};
  }
  return {headers:[],rows:[],csvRows:[]};
}

/* ============================================================
   CALCULADORAS — quanto cobrar pelo conserto, parcelas no cartão,
   lucro real da venda e as taxas da maquininha da loja.
   ============================================================ */
// Na OS: quanto cobrar no cartão para receber o total (usa as taxas da maquininha da loja).
async function osDicaCartao(total){
  const el=document.getElementById('os-cartao-dica'); if(!el) return;
  if(!(total>0)){ el.textContent=''; return; }
  const t=await calcTaxas(), c=calcTabelaCartao(total,t);
  el.textContent=`💳 Para receber ${fmtBRL(total)} limpo: débito ${fmtBRL(calcNoCartao(total,t.debito))} · 3x de ${fmtBRL(c[2].parcela)} · 10x de ${fmtBRL(c[9].parcela)}`;
}
/* CALC-INICIO (contas puras, testadas em leuapps/test/calculadoras.test.mjs) */
// Taxas de exemplo (%). Cada loja troca pelas da sua maquininha em "Taxas da maquininha".
const CALC_TAXAS_PADRAO={debito:1.99,credito:[4.99,6.29,7.49,8.69,9.89,10.99,12.09,12.99,14.19,15.29,16.49,17.59]};
const calcNum=(v)=>{ const n=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)&&n>0?n:0; };
const calcCent=(v)=>Math.round(v*100)/100;
// Preço para cobrar no cartão e ainda receber "liquido" depois da taxa.
function calcNoCartao(liquido,taxaPct){ return taxaPct>=100?0:calcCent(liquido/(1-taxaPct/100)); }
// Arredonda para cima: de R$ 5 em R$ 5 a partir de R$ 50, de R$ 1 em R$ 1 abaixo disso.
function calcArredondar(v){ if(v<=0) return 0; const passo=v>=50?5:1; return Math.ceil(v/passo-1e-9)*passo; }
function calcTabelaCartao(liquido,taxas){
  return taxas.credito.map((t,i)=>{ const total=calcNoCartao(liquido,t); return {vezes:i+1,taxa:t,total,parcela:calcCent(total/(i+1))}; });
}
/** Conserto: peças + lucro na peça + mão de obra + reserva para garantia + imposto. */
function calcConserto(e,taxas){
  const peca=calcNum(e.peca), outros=calcNum(e.outros), mao=calcNum(e.maoObra);
  const lucroPeca=peca*calcNum(e.lucroPecaPct)/100;
  const subtotal=peca+outros+lucroPeca+mao;
  const reserva=subtotal*calcNum(e.reservaPct)/100;
  const impostoPct=Math.min(calcNum(e.impostoPct),90);
  let vista=(subtotal+reserva)/(1-impostoPct/100);
  if(e.arredondar) vista=calcArredondar(vista);
  vista=calcCent(vista);
  const imposto=calcCent(vista*impostoPct/100);
  const ganho=calcCent(vista-peca-outros-reserva-imposto);
  return {peca,outros,lucroPeca:calcCent(lucroPeca),mao,reserva:calcCent(reserva),imposto,vista,ganho,
    debito:calcNoCartao(vista,taxas.debito),credito:calcTabelaCartao(vista,taxas)};
}
/** Parcelas: "receber" = quanto cobrar para sobrar o valor; "cobrar" = quanto sobra cobrando o valor. */
function calcParcelas(valor,modo,taxas){
  valor=calcNum(valor);
  const linha=(nome,t,vezes)=>{
    const total=modo==='receber'?calcNoCartao(valor,t):valor;
    const liquido=modo==='receber'?valor:calcCent(valor*(1-t/100));
    return {nome,vezes,taxa:t,total,parcela:calcCent(total/vezes),liquido,custo:calcCent(total-liquido)};
  };
  return [linha('Débito',taxas.debito,1),...taxas.credito.map((t,i)=>linha(i?`Crédito ${i+1}x`:'Crédito à vista',t,i+1))];
}
/** Venda de aparelho/acessório: lucro real depois de taxa e imposto, e o preço mínimo. */
function calcVenda(e,taxas){
  const custo=calcNum(e.custo)+calcNum(e.outros), preco=calcNum(e.preco);
  const forma=e.forma||'vista';
  const taxaPct=forma==='vista'?0:forma==='debito'?taxas.debito:(taxas.credito[Number(forma)-1]||0);
  const impostoPct=calcNum(e.impostoPct);
  const taxa=calcCent(preco*taxaPct/100), imposto=calcCent(preco*impostoPct/100);
  const lucro=calcCent(preco-custo-taxa-imposto);
  const resto=1-(taxaPct+impostoPct)/100;
  const minimo=resto>0?calcCent(custo/resto):0;
  const lucroPct=calcNum(e.lucroDesejadoPct);
  const sugerido=resto-lucroPct/100>0?calcCent(custo/(resto-lucroPct/100)):0;
  return {custo:calcCent(custo),preco,taxaPct,taxa,imposto,lucro,
    margem:preco?lucro/preco*100:0,sobreCusto:custo?lucro/custo*100:0,minimo,sugerido};
}
/* CALC-FIM */

async function calcTaxas(){
  const c=await idbGet('config','maquininha');
  if(!c||!Array.isArray(c.credito)||c.credito.length!==12) return CALC_TAXAS_PADRAO;
  return {debito:Number(c.debito)||0,credito:c.credito.map(t=>Number(t)||0)};
}
const calcPct=(v)=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const CALC_TABS=[
  {id:'conserto',label:'🔧 Conserto'},
  {id:'parcelas',label:'💳 Parcelas'},
  {id:'venda',label:'📱 Venda'},
  {id:'taxas',label:'⚙️ Taxas'},
];
// O que a pessoa digitou fica guardado enquanto o app está aberto (trocar de aba não apaga).
function calcEstado(aba,padrao){ return STATE.cache['calc_'+aba]||(STATE.cache['calc_'+aba]={...padrao}); }
const CALC_PADRAO={
  conserto:{servico:'',aparelho:'',peca:'',outros:'',maoObra:'',lucroPecaPct:'30',reservaPct:'5',impostoPct:'0',garantia:'90',arredondar:true},
  parcelas:{valor:'',modo:'receber'},
  venda:{custo:'',outros:'',preco:'',forma:'vista',impostoPct:'0',lucroDesejadoPct:'20'},
};
function calcCampo(id,label,valor,extra){
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" inputmode="decimal" value="${esc(valor)}" ${extra||''}></div>`;
}
function calcLinha(rotulo,valor,forte){
  return `<div class="flex-between small" style="padding:5px 0;${forte?'font-weight:800;font-size:14px;':''}"><span>${rotulo}</span><span class="mono">${valor}</span></div>`;
}
function calcTabelaHTML(linhas){
  return `<div class="table-wrap"><table><thead><tr><th>Forma</th><th class="right">Cobrar</th><th class="right">Parcela</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.nome||(l.vezes===1?'Crédito à vista':'Crédito '+l.vezes+'x')}<br><small class="muted">taxa ${calcPct(l.taxa)}</small></td><td class="right mono">${fmtBRL(l.total)}</td><td class="right mono">${l.vezes>1?l.vezes+'x '+fmtBRL(l.parcela):'—'}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function calcOrcamentoTexto(e,r){
  const loja=STATE.loja?.nome||'';
  const p3=r.credito[2], p10=r.credito[9];
  return [
    `*Orçamento${loja?' — '+loja:''}*`,
    [e.servico||'Conserto',e.aparelho].filter(Boolean).join(' · '),
    '',
    `💵 À vista (Pix ou dinheiro): *${fmtBRL(r.vista)}*`,
    `💳 Débito: ${fmtBRL(r.debito)}`,
    `💳 Crédito: 3x de ${fmtBRL(p3.parcela)} ou 10x de ${fmtBRL(p10.parcela)}`,
    calcNum(e.garantia)?`✅ Garantia de ${calcNum(e.garantia)} dias`:'',
  ].filter((l,i,a)=>l!==''||a[i-1]!=='').join('\n').trim();
}

async function calcResultadoHTML(aba){
  const taxas=await calcTaxas();
  if(aba==='conserto'){
    const e=calcEstado('conserto',CALC_PADRAO.conserto), r=calcConserto(e,taxas);
    if(!r.vista) return `<div class="empty-state">${ic('calc',30)}<h4>Digite o custo da peça e a mão de obra</h4><p>O preço à vista, no débito e parcelado aparece aqui na hora.</p></div>`;
    return `
      <div class="grid-cards" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px;">
        <div class="kpi-card"><div class="kpi-label">Cobrar à vista (Pix/dinheiro)</div><div class="kpi-value" style="color:var(--green);">${fmtBRL(r.vista)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Seu ganho neste conserto</div><div class="kpi-value">${fmtBRL(r.ganho)}</div><div class="kpi-delta ${r.ganho>0?'up':'down'}">mão de obra + lucro na peça</div></div>
      </div>

        ${calcLinha('Peça e outros custos',fmtBRL(r.peca+r.outros))}

        ${calcLinha('Mão de obra',fmtBRL(r.mao))}
        ${calcLinha('Reserva para garantia/retorno',fmtBRL(r.reserva))}
        ${r.imposto?calcLinha('Imposto',fmtBRL(r.imposto)):''}
        ${calcLinha('Preço à vista',fmtBRL(r.vista),true)}
      </div>
      <p class="small muted" style="margin:0 0 6px;">No cartão a taxa da maquininha já vai somada — você recebe os mesmos ${fmtBRL(r.vista)}.</p>
      ${calcTabelaHTML([{nome:'Débito',vezes:1,taxa:taxas.debito,total:r.debito,parcela:r.debito},...r.credito])}
      <div class="field" style="margin-top:14px;"><label for="calc-orc">Orçamento para mandar ao cliente</label><textarea id="calc-orc" rows="7" readonly>${esc(calcOrcamentoTexto(e,r))}</textarea></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn primary" id="calc-zap">💬 Enviar no WhatsApp</button>
        <button class="btn outline" id="calc-copiar">📋 Copiar</button>
      </div>`;
  }
  if(aba==='parcelas'){
    const e=calcEstado('parcelas',CALC_PADRAO.parcelas), linhas=calcParcelas(e.valor,e.modo,taxas);
    if(!calcNum(e.valor)) return `<div class="empty-state">${ic('calc',30)}<h4>Digite um valor</h4><p>A tabela do débito até 12x aparece aqui.</p></div>`;
    return `<div class="table-wrap"><table><thead><tr><th>Forma</th><th class="right">Cliente paga</th><th class="right">Você recebe</th></tr></thead><tbody>
      ${linhas.map(l=>`<tr><td>${l.nome}<br><small class="muted">taxa ${calcPct(l.taxa)}</small></td><td class="right mono">${fmtBRL(l.total)}${l.vezes>1?`<br><small class="muted">${l.vezes}x ${fmtBRL(l.parcela)}</small>`:''}</td><td class="right mono" style="font-weight:700;">${fmtBRL(l.liquido)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:8px;">${e.modo==='receber'?'Cobrando o valor da coluna "Cliente paga", sobra exatamente '+fmtBRL(calcNum(e.valor))+' para você.':'A coluna "Você recebe" já desconta a taxa da maquininha.'}</p>`;
  }
  if(aba==='venda'){
    const e=calcEstado('venda',CALC_PADRAO.venda), r=calcVenda(e,taxas);
    if(!r.custo) return `<div class="empty-state">${ic('calc',30)}<h4>Digite quanto o aparelho custou</h4><p>O lucro real, depois da taxa e do imposto, aparece aqui.</p></div>`;
    const cor=r.preco&&r.lucro<0?'var(--red)':'var(--green)';
    return `
      <div class="grid-cards" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px;">
        <div class="kpi-card"><div class="kpi-label">Lucro real</div><div class="kpi-value" style="color:${cor};">${r.preco?fmtBRL(r.lucro):'—'}</div>${r.preco?`<div class="kpi-delta ${r.lucro>=0?'up':'down'}">${calcPct(r.margem)} do preço · ${calcPct(r.sobreCusto)} sobre o custo</div>`:''}</div>
        <div class="kpi-card"><div class="kpi-label">Preço mínimo (sem prejuízo)</div><div class="kpi-value">${fmtBRL(r.minimo)}</div><div class="kpi-delta warn">nesta forma de pagamento</div></div>
      </div>
      ${r.preco&&r.lucro<0?`<div class="callout warn" style="margin-bottom:12px;"><span>${ic('warn',15)}</span><span>Vendendo por ${fmtBRL(r.preco)} você <b>perde ${fmtBRL(-r.lucro)}</b>. Cobre pelo menos ${fmtBRL(r.minimo)}.</span></div>`:''}
      <div class="panel" style="padding:10px 14px;margin-bottom:12px;">
        ${calcLinha('Custo do aparelho + outros',fmtBRL(r.custo))}
        ${r.preco?calcLinha('Taxa da maquininha ('+calcPct(r.taxaPct)+')',fmtBRL(r.taxa)):''}
        ${r.preco&&r.imposto?calcLinha('Imposto',fmtBRL(r.imposto)):''}
        ${r.preco?calcLinha('Sobra para você',fmtBRL(r.lucro),true):''}
      </div>
      <div class="callout info"><span>${ic('lightning',15)}</span><span>Para ganhar <b>${calcPct(calcNum(e.lucroDesejadoPct))}</b> do preço nesta forma de pagamento, venda por <b>${fmtBRL(r.sugerido)}</b>.</span></div>`;
  }
  return '';
}

const LICENSE_LOCAL_SECRET='LeuName-Ativacao-Local-PrimeiroCliente-2026-v1';
const LICENSE_LS_KEY='leuname_licenca_ativa';
function licenseChecksumValid(key){
  if(!key) return false;
  const m=/^LEU-([0-9A-Z]{4})-([0-9A-Z]{4})-([0-9A-Z]{4})$/.exec(key.trim().toUpperCase());
  return !!m; // checagem rápida de formato (sem custo de crypto)
}
/* Checksum HMAC-SHA256 local: os 2 primeiros grupos da chave são livres (identificam
   o cliente) e o 3º grupo é a assinatura desses 2 grupos com um segredo embutido no
   próprio app. Isso permite validar a chave 100% offline, sem servidor, mantendo a
   chave exclusiva de quem a gerou com o script gerador (mesmo segredo). */
async function licenseChecksum(g1,g2){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(LICENSE_LOCAL_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('HMAC',keyMaterial,enc.encode('LEU-'+g1+'-'+g2));
  return Array.from(new Uint8Array(sig)).slice(0,2).map(b=>b.toString(16).toUpperCase().padStart(2,'0')).join('');
}
async function licenseKeyValid(key){
  if(!licenseChecksumValid(key)) return false;
  const m=/^LEU-([0-9A-Z]{4})-([0-9A-Z]{4})-([0-9A-Z]{4})$/.exec(key.trim().toUpperCase());
  const [,g1,g2,checksum]=m;
  const esperado=await licenseChecksum(g1,g2);
  return esperado===checksum;
}
async function isLicenseActivated(){
  const key=lsGet(LICENSE_LS_KEY);
  if(!key) return false;
  return await licenseKeyValid(key);
}
const TRIAL_DIAS=7;
// Testes iniciados antes da mudança para 7 dias continuam com os 17 dias prometidos.
const TRIAL_DIAS_ANTIGO=17, TRIAL_MUDOU_EM=Date.UTC(2026,9,1);
const TRIAL_INICIO_LS_KEY='leuname_trial_iniciado_em';
function isTrialKey(key){
  const m=/^LEU-([0-9A-Z]{4})-/.exec((key||'').trim().toUpperCase());
  return !!m && m[1]==='TRIA';
}
function trialExpirado(){
  const key=lsGet(LICENSE_LS_KEY);
  if(!isTrialKey(key)) return false;
  const inicio=Number(lsGet(TRIAL_INICIO_LS_KEY)||0);
  if(!inicio) return false;
  const dias = inicio < TRIAL_MUDOU_EM ? TRIAL_DIAS_ANTIGO : TRIAL_DIAS;
  return (Date.now()-inicio) > dias*86400000;
}
const LICENSE_REVOKED_LS_KEY='leuname_licenca_revogada';
/* Consulta o servidor de licencas para saber se a chave foi revogada (ex:
   cliente inadimplente). So bloqueia com confirmacao explicita do servidor
   (status !== 'ativa'); qualquer falha de rede, resposta invalida ou chave
   nao encontrada NAO bloqueia -- o app continua 100% funcional offline. */
async function checkLicenseRevoked(){
  const chave=lsGet(LICENSE_LS_KEY);
  if(!chave) return false;
  // Chave de teste: gerada localmente, nunca cadastrada no servidor -- a
  // trava de "chave nao cadastrada" abaixo e so pra chaves compradas.
  if(isTrialKey(chave)) return false;
  let resp;
  try{ resp=await fetch(SYNC_API_BASE+'/licencas/verificar?chave='+encodeURIComponent(chave)); }
  catch(e){ return false; }
  if(!resp.ok) return false;
  let data;
  try{ data=await resp.json(); }catch(e){ return false; }
  if(!data||!data.ok) return false;
  if(!data.encontrada){ lsSet(LICENSE_REVOKED_LS_KEY,'1'); return true; }
  if(data.status && data.status!=='ativa'){ lsSet(LICENSE_REVOKED_LS_KEY,'1'); return true; }
  lsSet(LICENSE_REVOKED_LS_KEY,''); return false;
}

        toast('Licença ativada localmente.','success'); render();
      };

};

async function fazerBackupAgora(){
  const payload=await exportAllData();
  const filename='leuname-backup-'+todayStr()+'-'+String(Date.now()).slice(-5)+'.json';
  const ok=await saveFile(filename,JSON.stringify(payload,null,2),'application/json');
  const cfg=await getConfig(); cfg.backup.ultimo_backup=nowISO(); await saveConfig(cfg);
  await idbPut('backups',{id:uid(),data:nowISO(),tipo:'Manual',dispositivo:detectDeviceType().tipo+' ('+detectDeviceType().so+')',status:ok?'ok':'erro'});
  await logAction('backup_manual',filename);
  if(ok) toast('Backup gerado com sucesso.','success');
  render();
}
async function restaurarBackupArquivo(file){
  try{
    const text=await readFileAsText(file);
    const payload=JSON.parse(text);
    if(!payload.data||!payload.app){ toast('Arquivo de backup inválido.','error'); return; }
    const ok=await confirmDialog('Restaurar backup','Isso substituirá todos os dados atuais deste dispositivo pelos dados do arquivo selecionado. Esta ação não pode ser desfeita. Deseja continuar?',{danger:true,okLabel:'Restaurar'});
    if(!ok) return;
    await importAllData(payload,'replace');
    await logAction('backup_restaurado',file.name);
    toast('Backup restaurado com sucesso! Recarregando...','success');
    setTimeout(()=>location.reload(),1200);
  }catch(e){ toast('Não foi possível ler o arquivo de backup.','error'); }
}
async function maybeAutoBackupPrompt(){
  try{
    const cfg=await getConfig();
    if(!cfg.backup.auto) return;
    const last=cfg.backup.ultimo_backup;
    const days=last?daysBetween(last,nowISO()):999;
    const thresholds={tempo_real:0,diaria:1,semanal:7,mensal:30};
    const limit=thresholds[cfg.backup.frequencia]??1;
    if(days>=limit){
      setTimeout(()=>toast('Lembrete: considere fazer um backup em Configurações → Backup e Sincronização.','info'),1500);
    }
  }catch(e){}
}

    {label:'Produtos',icon:'produtos',nav:'produtos',items:produtos.filter(p=>(p.nome||'').toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)).slice(0,4).map(p=>({title:p.nome,sub:fmtBRL(p.preco)+' · Estoque: '+p.quantidade}))},

    {label:'Ordens de Serviço',icon:'os',nav:'os',items:ordens.filter(o=>String(o.numero).includes(q)||(o.aparelho||'').toLowerCase().includes(q)).slice(0,4).map(o=>({title:'Nº '+o.numero+' — '+o.aparelho,sub:o.status}))},
    {label:'Vendas',icon:'vendas',nav:'vendas',items:vendas.filter(v=>String(v.numero).includes(q)).slice(0,4).map(v=>({title:'Venda Nº '+v.numero,sub:fmtBRL(v.total)}))},
    {label:'Fornecedores',icon:'fornecedores',nav:'fornecedores',items:fornecedores.filter(f=>(f.nome||'').toLowerCase().includes(q)).slice(0,4).map(f=>({title:f.nome,sub:f.telefone||''}))},
  ].filter(g=>g.items.length);
  if(!groups.length) return '<div class="empty-state" style="padding:20px;"><p>Nenhum resultado para "'+esc(q)+'".</p></div>';

async function computeAlerts(){
  const alerts=[];
  const [produtos,pecas,ordens,financeiro,cfg]=await Promise.all([idbAll('produtos'),idbAll('pecas'),idbAll('ordens'),idbAll('financeiro'),getConfig()]);
  produtos.filter(p=>Number(p.quantidade)<=Number(p.estoque_minimo||0)).forEach(p=>alerts.push({type:'amber',title:'Estoque baixo: '+p.nome,sub:'Restam '+p.quantidade+' unidade(s)',nav:'produtos'}));
  pecas.filter(p=>Number(p.quantidade)<=Number(p.estoque_minimo||0)).forEach(p=>alerts.push({type:'amber',title:'Peça em falta: '+p.nome,sub:'Restam '+p.quantidade+' unidade(s)',nav:'pecas'}));
  ordens.filter(o=>o.status==='PRONTO').forEach(o=>alerts.push({type:'green',title:'OS Nº '+o.numero+' pronta para entrega',sub:o.aparelho||'',nav:'os'}));
  ordens.filter(o=>o.status==='AGUARDANDO APROVAÇÃO').forEach(o=>alerts.push({type:'amber',title:'OS Nº '+o.numero+' aguardando aprovação',sub:o.aparelho||'',nav:'os'}));
  ordens.filter(o=>o.status==='AGUARDANDO PEÇA').forEach(o=>alerts.push({type:'amber',title:'OS Nº '+o.numero+' aguardando peça',sub:o.aparelho||'',nav:'os'}));
  const hoje=new Date();
  financeiro.filter(f=>f.status==='pendente').forEach(f=>{
    const d=new Date(f.data);
    if(!isNaN(d) && d<=new Date(hoje.getTime()+3*86400000)) alerts.push({type: d<hoje?'red':'amber', title:(f.tipo==='receita'?'Conta a receber: ':'Conta a pagar: ')+f.descricao, sub:fmtDate(f.data)+' · '+fmtBRL(f.valor), nav:'financeiro'});
  });
  if(!cfg.nuvem.conectado){ /* informativo, não gera alerta de erro por padrão */ }
  return alerts;
}

function setupPWA(){
  try{
    const favicon=document.createElement('link');
    favicon.rel='icon'; favicon.type='image/png'; favicon.href=LOGO_DATA_URI;
    document.head.appendChild(favicon);
    const appleTouch=document.createElement('link');
    appleTouch.rel='apple-touch-icon'; appleTouch.href=location.hostname==='gestacell.leunamesoftware.com.br'?'/img/gestacell-192.png':LOGO_DATA_URI;
    document.head.appendChild(appleTouch);
  }catch(e){ console.warn('Favicon indisponível neste ambiente.',e); }
  // Dentro do www (www.leunamesoftware.com.br/gestacell/): manifesto próprio, para a loja instalar o Gestacell direto (ícone próprio).
  if(location.pathname.startsWith('/gestacell/') && !document.querySelector('link[rel=manifest]')){
    try{ const link=document.createElement('link'); link.rel='manifest'; link.href='/gestacell/www.webmanifest'; document.head.appendChild(link); }catch(e){}
  }
  // Instalar como app (ícone próprio) no endereço próprio.
  if(location.hostname==='gestacell.leunamesoftware.com.br'){
    try{
      if(!document.querySelector('link[rel=manifest]')){ const link=document.createElement('link'); link.rel='manifest'; link.href='/app.webmanifest'; document.head.appendChild(link); }
      if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
    }catch(e){ console.warn('Instalação indisponível neste navegador.',e); }
  }
}

let __booted=false;
async function boot(){
  if(__booted) return; __booted=true;
  try{ await openDB(); }catch(e){ console.error('Falha ao abrir banco local',e); }
  try{ await syncMigrateExisting(); }catch(e){ console.error('Falha ao preparar sincronizacao',e); }
  setupPWA();
  // Abre com o acesso da conta da loja (teste grátis de 3 dias, mensal, anual ou pagamento único) ou chave antiga.
  if(!(await isLicenseActivated()) || trialExpirado() || !(await acessoDaContaValendo())){
    const tinha=lsGet(LICENSE_LS_KEY);
    if(!(await chaveDaConta())){
      lsSet(LICENSE_LS_KEY,''); lsSet(CONTA_EXPIRA_LS_KEY,'');
      renderLicenseGate(__motivoConta==='outro_aparelho'?MSG_OUTRO_APARELHO:tinha?(isTrialKey(tinha)?'O seu teste grátis terminou. Escolha um plano para continuar usando.':'O seu plano terminou. Escolha um plano para continuar usando.'):'');
      return;
    }
  }
  if(lsGet(LICENSE_REVOKED_LS_KEY)==='1'){
    renderLicenseRevoked();
    checkLicenseRevoked().then(revoked=>{ if(!revoked){ __booted=false; boot(); } });
    return;
  }
  // Aguarda a checagem (com teto de 4s) ANTES de renderizar onboarding/login,
  // para nao correr o risco dessas telas sobrescreverem a tela de bloqueio
  // caso a resposta do servidor chegue no meio do boot. Offline ou lento:
  // depois de 4s segue normalmente (nunca trava o app por causa da rede).
  const revogadaNoBoot = await Promise.race([
    checkLicenseRevoked(),
    new Promise(resolve=>setTimeout(()=>resolve(false),4000)),
  ]);
  if(revogadaNoBoot){ renderLicenseRevoked(); return; }
  const restored = await tryRestoreSession();
  if(restored){ await startApp(); syncNow().catch(()=>{}); return; }
  let firstRun = await isFirstRun();
  if(firstRun){
    // Antes de criar uma loja nova neste aparelho, tenta puxar dados que
    // ja existam na nuvem para esta mesma licenca (outro aparelho pode
    // ja ter configurado a loja) -- assim nao duplica a loja/admin.
    try{ await syncPull(); }catch(e){}
    firstRun = await isFirstRun();
  }
  if(firstRun){ OB={step:1,data:{resp_nome:'',resp_email:'',resp_senha:'',resp_senha2:'',loja_nome:'',loja_cnpj:'',loja_tel:'',loja_whats:'',loja_end:'',logo:null,licenca:''}}; renderOnboarding(); }
  else { await renderLogin(); syncNow().catch(()=>{}); }
}
document.addEventListener('DOMContentLoaded', boot);
// App aberto há tempo: ao voltar para ele (no máximo a cada 5 min), confere se a conta ainda vale neste aparelho.
let __ultimaConferencia=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible' || !navigator.onLine || lsGet(DA_CONTA_LS_KEY)!=='1' || Date.now()-__ultimaConferencia<300000) return;
  __ultimaConferencia=Date.now();
  chaveDaConta().then((ok)=>{ if(ok===false) location.reload(); });
});
if(document.readyState==='complete' || document.readyState==='interactive'){ boot(); }
window.addEventListener('online', ()=>{ syncNow().catch(()=>{}); });
setInterval(()=>{ syncNow().catch(()=>{}); }, 90000);

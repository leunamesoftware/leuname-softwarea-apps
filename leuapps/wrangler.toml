# LeuApps — central oficial de aplicativos da LeuName Softwares.
# Endereço principal: www.leunamesoftware.com.br (também apps.leunamesoftware.com.br).
name = "leuapps"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Tudo passa primeiro pelo src/index.js (para mandar http → https); ele serve os arquivos da loja pelo ASSETS.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Conta do dono: única que abre a Área do Dono (/dono/).
[vars]
DONO_EMAIL = "leunamesoftware@gmail.com"

# Site antigo (painel, licenças e páginas antigas) continua respondendo pelos endereços dele.
[[services]]
binding = "SITE_ANTIGO"
service = "leuname-site-br"

# Servidor de vendas e contas (worker do Quanto Cobrar): /loja/* e /loja-api/*.
[[services]]
binding = "CONTAS"
service = "calculadora-receitas"

[[routes]]
pattern = "apps.leunamesoftware.com.br"
custom_domain = true

[[routes]]
pattern = "www.leunamesoftware.com.br"
custom_domain = true

[[routes]]
pattern = "leunamesoftware.com.br"
custom_domain = true

# Área do Dono (só o dono; instala como app separado no celular).
[[routes]]
pattern = "dono.leunamesoftware.com.br"
custom_domain = true

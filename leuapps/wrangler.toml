# LeuApps — central oficial de aplicativos da LeuName Softwares.
# Endereço principal: www.leunamesoftware.com.br (também apps.leunamesoftware.com.br).
name = "leuapps"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Arquivos da loja são servidos direto; o que não existir aqui passa pelo src/index.js.
[assets]
directory = "public"
binding = "ASSETS"

# Site antigo (painel, licenças e páginas antigas) continua respondendo pelos endereços dele.
[[services]]
binding = "SITE_ANTIGO"
service = "leuname-site-br"

# Servidor de vendas e contas (worker do Quanto Cobrar): /loja/* e /loja-api/*.
[[services]]
binding = "CONTAS"
service = "calculadora-receitas"

[[routes]]
pattern = "apps.leunamesoftware.com.br"
custom_domain = true

[[routes]]
pattern = "www.leunamesoftware.com.br"
custom_domain = true

[[routes]]
pattern = "leunamesoftware.com.br"
custom_domain = true

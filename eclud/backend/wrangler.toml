name = "eclud-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Criar uma vez com: npx wrangler d1 create eclud-db
# e colar aqui o database_id devolvido pelo comando.
[[d1_databases]]
binding = "DB"
database_name = "eclud-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# Origens autorizadas a chamar a API pelo navegador (versão PC/web).
ALLOWED_ORIGINS = "https://eclud.app"
# Enquanto o pagamento não estiver integrado, "false" deixa qualquer
# membro usar descontos. Em produção, com pagamento ativo, use "true".
REQUIRE_SUBSCRIPTION = "false"

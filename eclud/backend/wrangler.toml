name = "eclud-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Banco criado na região Europa Ocidental (RGPD: dados na UE).
[[d1_databases]]
binding = "DB"
database_name = "eclud-db"
database_id = "8d4e3bc8-65b0-4e32-9b35-2622865cdcbb"
migrations_dir = "migrations"

# Fotos dos estabelecimentos.
[[r2_buckets]]
binding = "FILES"
bucket_name = "eclud-files"

[vars]
ENVIRONMENT = "production"
# Origens autorizadas a chamar a API pelo navegador (versão PC/web).
# A esteira de publicação substitui pelo endereço real do site.
ALLOWED_ORIGINS = "https://eclud.pages.dev"
# Enquanto o pagamento não estiver integrado, "false" deixa qualquer
# membro usar descontos. Em produção, com pagamento ativo, use "true".
REQUIRE_SUBSCRIPTION = "false"
PLAY_PACKAGE_NAME = "com.leunamesoftwares.eclud"
EMAIL_FROM = "Eclud <no-reply@leunamesoftware.com>"
# Segredos (wrangler secret put): JWT_SECRET, GOOGLE_SERVICE_ACCOUNT,
# PLAY_RTDN_TOKEN, RESEND_API_KEY.

name: eclud
description: "Eclud - Euro Club de Descuentos"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # Montserrat empacotada no app (licença OFL): não depende de baixar fontes
  # do Google em tempo de execução, o que evita enviar o IP do usuário a
  # terceiros (exigência do RGPD).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#06100C"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#06100C"
    theme_color: "#06100C"

# Tela de abertura nativa (aparece enquanto o app carrega).
flutter_native_splash:
  color: "#06100C"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#06100C"
    image: assets/branding/splash_mark.png
    icon_background_color: "#06100C"
  web: true

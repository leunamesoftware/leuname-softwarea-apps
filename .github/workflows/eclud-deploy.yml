name: Eclud — testar e publicar

# Testa o app e a API e publica na Cloudflare:
#   - API  → Worker "eclud-api" (endereço *.workers.dev, não aparece ao usuário)
#   - Site → Cloudflare Pages "eclud" (endereço eclud.pages.dev)
# Precisa dos secrets do repositório CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions).

on:
  push:
    branches:
      - main
      - claude/aplicativo-profissional-7irtpr
    paths:
      - 'eclud/**'
      - '.github/workflows/eclud-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eclud-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API — tipos e testes
        working-directory: eclud/backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: App — análise e testes
        working-directory: eclud
        run: |
          flutter pub get
          flutter analyze
          flutter test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir credenciais da Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no repositório."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências da API
        working-directory: eclud/backend
        run: npm ci

      - name: Descobrir endereços (Pages e workers.dev)
        id: urls
        working-directory: eclud/backend
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Cria o projeto do site na primeira vez (se já existir, segue).
          # Roda fora da pasta da API para não ler o wrangler.toml do Worker.
          (cd .. && npx --yes wrangler@4 pages project create eclud --production-branch=main) || true
          pages=$(curl -fsS -H "$auth" "$api/pages/projects/eclud" | jq -r '.result.subdomain')
          workers=$(curl -fsS -H "$auth" "$api/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$pages" ] || [ "$pages" = "null" ] || [ -z "$workers" ] || [ "$workers" = "null" ]; then
            echo "::error::Não foi possível descobrir os endereços do Pages/workers.dev."
            exit 1
          fi
          echo "site=https://$pages" >> "$GITHUB_OUTPUT"
          echo "api=https://eclud-api.$workers.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Publicar API
        working-directory: eclud/backend
        run: |
          npx wrangler d1 migrations apply eclud-db --remote
          npx wrangler deploy --var "ALLOWED_ORIGINS:${{ steps.urls.outputs.site }}"
          # Gera o segredo das sessões só na primeira publicação; depois
          # ele é mantido (trocar deslogaria todo mundo).
          if ! npx wrangler secret list | grep -q '"JWT_SECRET"'; then
            openssl rand -base64 48 | npx wrangler secret put JWT_SECRET
          fi
          curl -fsS "${{ steps.urls.outputs.api }}/health"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Construir e publicar o site
        working-directory: eclud
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=TERMS_URL=${{ steps.urls.outputs.site }}/legal/terminos.html \
            --dart-define=PRIVACY_URL=${{ steps.urls.outputs.site }}/legal/privacidad.html
          npx --yes wrangler@4 pages deploy build/web --project-name=eclud --branch=main --commit-dirty=true
          echo "### Eclud publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: ${{ steps.urls.outputs.site }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.urls.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"

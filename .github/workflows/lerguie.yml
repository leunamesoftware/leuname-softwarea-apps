name: Lerguie (Android + backend)

# Compila e testa o app Android e o backend do Lerguie a cada mudança em lerguie/.
# Gera APK de teste e AAB de release como artefatos para download.
# Assinatura de release (opcional): secrets LERGUIE_KEYSTORE_BASE64, LERGUIE_KEYSTORE_PASSWORD,
# LERGUIE_KEY_ALIAS, LERGUIE_KEY_PASSWORD. URL do backend (opcional): variável LERGUIE_API_URL.

on:
  push:
    paths:
      - 'lerguie/**'
      - '.github/workflows/lerguie.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lerguie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lerguie/android
    env:
      LERGUIE_API_URL: ${{ vars.LERGUIE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore de release (se configurado)
        env:
          KEYSTORE_B64: ${{ secrets.LERGUIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lerguie.jks"
            echo "LERGUIE_KEYSTORE_FILE=$RUNNER_TEMP/lerguie.jks" >> "$GITHUB_ENV"
          fi
      - name: Testes unitários + APK debug + AAB release
        env:
          LERGUIE_KEYSTORE_PASSWORD: ${{ secrets.LERGUIE_KEYSTORE_PASSWORD }}
          LERGUIE_KEY_ALIAS: ${{ secrets.LERGUIE_KEY_ALIAS }}
          LERGUIE_KEY_PASSWORD: ${{ secrets.LERGUIE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lerguie-apk-debug
          path: lerguie/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lerguie-aab-release
          path: lerguie/android/app/build/outputs/bundle/release/*.aab

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lerguie/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

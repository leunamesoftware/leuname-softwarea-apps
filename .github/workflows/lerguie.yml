name: Lerguie (Android + backend)

# Compila e testa o app Android e o backend do Lerguie a cada mudança em lerguie/.
# Gera APK de teste e AAB de release como artefatos para download.
# Assinatura de release (opcional): secrets LERGUIE_KEYSTORE_BASE64, LERGUIE_KEYSTORE_PASSWORD,
# LERGUIE_KEY_ALIAS, LERGUIE_KEY_PASSWORD. URL do backend (opcional): variável LERGUIE_API_URL.

on:
  push:
    paths:
      - 'lerguie/**'
      - '.github/workflows/lerguie.yml'
  workflow_dispatch: {}

permissions:
  contents: write  # publicar o APK de teste em Releases

concurrency:
  group: lerguie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publica o servidor de IA no Cloudflare quando os segredos existem; senão, pula sem falhar.
  # Segredos (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN,
  # CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY.
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: lerguie/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar backend
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Backend não publicado: faltam segredos CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e/ou ANTHROPIC_API_KEY."
            exit 0
          fi
          npm ci
          npx wrangler deploy | tee deploy.log
          echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          # Segredo de sessão novo a cada publicação: o app renova o token sozinho (HTTP 401).
          openssl rand -hex 48 | npx wrangler secret put SESSION_SECRET
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Backend publicado em $URL"

  android:
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lerguie/android
    env:
      LERGUIE_API_URL: ${{ needs.deploy-backend.outputs.url || vars.LERGUIE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore de release (se configurado)
        env:
          KEYSTORE_B64: ${{ secrets.LERGUIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lerguie.jks"
            echo "LERGUIE_KEYSTORE_FILE=$RUNNER_TEMP/lerguie.jks" >> "$GITHUB_ENV"
          fi
      - name: Testes unitários + APK debug + AAB release
        env:
          LERGUIE_KEYSTORE_PASSWORD: ${{ secrets.LERGUIE_KEYSTORE_PASSWORD }}
          LERGUIE_KEY_ALIAS: ${{ secrets.LERGUIE_KEY_ALIAS }}
          LERGUIE_KEY_PASSWORD: ${{ secrets.LERGUIE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Plerguie.versionCode=${{ github.run_number }} testDebugUnitTest assembleDebug assembleBeta bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lerguie-apk-debug
          path: lerguie/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lerguie-aab-release
          path: lerguie/android/app/build/outputs/bundle/release/*.aab
      # Download direto do APK pelo celular (release própria e única por build)
      - name: Preparar APKs de teste
        run: |
          cp app/build/outputs/apk/beta/app-arm64-v8a-beta.apk "$RUNNER_TEMP/Lerguie-teste.apk"
          cp app/build/outputs/apk/beta/app-armeabi-v7a-beta.apk "$RUNNER_TEMP/Lerguie-teste-celular-antigo.apk"
          ls -la "$RUNNER_TEMP"/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lerguie-v1.0.0-teste.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Lerguie 1.0.0 — teste ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            APK de teste do Lerguie para instalar direto no celular.
            • Lerguie-teste.apk → celulares atuais (quase todos)
            • Lerguie-teste-celular-antigo.apk → só se o primeiro não instalar
            Se pedir, permita "instalar apps desconhecidos" para o navegador.
          files: |
            ${{ runner.temp }}/Lerguie-teste.apk
            ${{ runner.temp }}/Lerguie-teste-celular-antigo.apk

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lerguie/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
